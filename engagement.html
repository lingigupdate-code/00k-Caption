<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>00K Engagement - Calvin Klein x NYFW</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<script src="data.js?v=8"></script>

<style>

/* ================= THEME SYSTEM ================= */

:root{
  --primary:#ffffff;
  --accent:#A3835F;
  --bg-overlay: rgba(0,0,0,0.5);
  --card:rgba(255, 255, 255, 0.07);
  --card-border:rgba(255, 255, 255, 0.12);
  --text-main:#ffffff;
  --text-muted:rgba(255, 255, 255, 0.7);
}

body{
  margin:0;
  color:var(--text-main);
  font-family:'Plus Jakarta Sans',sans-serif;
  background-color:#000;
  background-image:linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url("https://lingigupdate-code.github.io/00k-Caption/image/20260809-3.jpg");
  background-position:center;
  background-repeat: no-repeat !important; 
  background-size: contain !important;
  background-attachment:fixed;
  min-height:100vh;
  transition:0.4s ease;
  overflow-x: hidden;
}

/* Artist Theme */
body[data-theme="artist"]{
  --accent:#C5A059;
}

/* Media Theme */
body[data-theme="media"]{
  --accent:#8B7355;
}

/* ================= HEADER ================= */

.header{
  text-align:center;
  padding:30px 15px 5px;
}
.header h1{
  font-family:'Outfit',sans-serif;
  font-weight:700;
  font-size:26px;
  letter-spacing:1.5px;
  color:var(--primary);
  margin:0;
  text-shadow: 0 2px 10px rgba(0,0,0,0.5);
}
.header p{
  font-size:11px;
  color:var(--text-muted);
  letter-spacing:1.5px;
  margin-top:6px;
  text-transform: uppercase;
}

/* ================= TYPE TABS ================= */

.type-tabs{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-bottom:20px;
  padding: 0 10px;
  flex-wrap: wrap;
}

.type-tabs button{
  padding:8px 16px;
  border-radius:30px;
  border:1px solid var(--card-border);
  background:rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(10px);
  color:var(--text-muted);
  cursor:pointer;
  font-weight:600;
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size: 12px;
  transition:0.3s;
}

.type-tabs button:hover{
  background:rgba(255, 255, 255, 0.15);
  color:#fff;
}

.type-tabs button.active{
  background:var(--primary);
  color:#000;
  border-color:var(--primary);
}

/* ================= CONTROLS ================= */

.controls{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:15px 15px 25px;
  flex-wrap:wrap;
}

select{
  padding:8px 12px;
  border-radius:10px;
  border:1px solid var(--card-border);
  background:rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(10px);
  color:#fff;
  font-weight:500;
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size: 12px;
  outline: none;
  cursor: pointer;
}

select option {
  background: #111;
  color: #fff;
}

/* ================= POST COUNT BREAKDOWN ================= */

.quest-container {
  width: 92%;
  max-width: 1200px;
  margin: 0 auto 20px;
  background: var(--card);
  backdrop-filter: blur(15px);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  padding: 16px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.25);
}

.quest-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  flex-wrap: wrap;
  gap: 8px;
}

.quest-title {
  font-family: 'Outfit', sans-serif;
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 6px;
}

.quest-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

@media(max-width: 750px) {
  .quest-grid { grid-template-columns: 1fr; }
  .quest-container { padding: 12px 10px; }
  .quest-card { padding: 8px 4px !important; border-radius: 10px !important; }
  .quest-label { font-size: 9px !important; margin-bottom: 3px !important; }
  .quest-values { font-size: 11px !important; }
}

.quest-card {
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  padding: 12px 10px;
  text-align: center;
  position: relative;
  overflow: hidden;
  transition: 0.3s;
}

.quest-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: var(--text-muted);
  margin-bottom: 4px;
  text-transform: uppercase;
}

.quest-values {
  font-family: 'Outfit', sans-serif;
  font-size: 14px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 0;
}

/* ================= SECTION HEADINGS ================= */

.section-container {
  width: 92%;
  max-width: 1200px;
  margin: 30px auto 10px;
}

.section-title {
  font-family: 'Outfit', sans-serif;
  font-size: 17px;
  font-weight: 700;
  color: #fff;
  border-left: 3px solid var(--accent);
  padding-left: 10px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.platform-sub-container {
  width: 92%;
  max-width: 1200px;
  margin: 15px auto 20px;
  background: var(--card);
  backdrop-filter: blur(15px);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  padding: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.25);
}

.platform-sub-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* ================= PAGINATION STYLES ================= */
.pagination {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 5px;
  margin: 15px 0 5px;
  flex-wrap: wrap;
}

.page-btn {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--card-border);
  color: #fff;
  padding: 5px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 11px;
  font-weight: 600;
  transition: 0.2s;
}

.page-btn:hover {
  background: rgba(255, 255, 255, 0.15);
}

.page-btn.active {
  background: var(--accent);
  color: #000;
  border-color: var(--accent);
}

.page-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

/* ================= GRID & CARDS ================= */

.grid{
  width:92%;
  max-width:1200px;
  margin:15px auto 25px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

@media(max-width:900px){ .grid{grid-template-columns:repeat(2,1fr); gap: 12px;} }
@media(max-width:500px){ .grid{grid-template-columns:1fr; gap: 12px;} }

.grid-compact {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

@media(max-width:900px){ .grid-compact{grid-template-columns:repeat(3,1fr); gap: 6px;} }
@media(max-width:600px){ .grid-compact{grid-template-columns:repeat(2,1fr); gap: 6px;} }
@media(max-width:380px){ .grid-compact{grid-template-columns:1fr; gap: 6px;} }

.card{
  background:var(--card);
  backdrop-filter: blur(15px);
  border:1px solid var(--card-border);
  border-radius:16px;
  padding:16px;
  transition:0.3s;
  box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.card.clickable-card {
  cursor: pointer;
}

.card.clickable-card.opened {
  background: rgba(46, 125, 50, 0.25) !important;
  border-color: #2E7D32 !important;
}

.card:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 25px rgba(0,0,0,0.4);
  border-color: rgba(255,255,255,0.25);
}

.empty-state{
  grid-column: 1 / -1;
  background: var(--card);
  backdrop-filter: blur(15px);
  border: 2px dashed var(--card-border);
  border-radius: 16px;
  padding: 30px 15px;
  text-align: center;
  color: var(--text-muted);
}

.empty-state h3{
  font-size: 15px;
  color: #fff;
  margin-bottom: 5px;
  font-family:'Outfit',sans-serif;
}

.empty-state p{
  font-size: 12px;
  margin: 0;
}

.spinner{
  width: 28px;
  height: 28px;
  border: 3px solid rgba(255,255,255,0.1);
  border-top: 3px solid var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 12px;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.post-img{
  width:100%;
  border-radius:12px;
  aspect-ratio:4/5;
  object-fit:cover;
  margin-bottom:10px;
  border: 1px solid rgba(255,255,255,0.1);
}

.badge{
  display:inline-block;
  padding:3px 10px;
  border-radius:20px;
  font-size:10px;
  font-weight:600;
  margin-bottom:8px;
  color:#fff;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.1);
}

.badge.artist{
  background:var(--accent);
  color:#000;
}

.badge.brand{
  background:#D4AF37;
  color:#000;
}

.badge.media{
  background:rgba(255,255,255,0.15);
}

.platform-title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 600;
  font-size: 11px;
  margin-bottom: 6px;
  color: #fff;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  line-height: 1.3;
}

.platform-icon {
  width: 12px;
  height: 12px;
  filter: brightness(0) invert(1);
  flex-shrink: 0;
}

/* ================= IMPORTANT MEDIA HIGHLIGHT ================= */
.miv-btn.highlight-media {
  background: linear-gradient(135deg, rgba(212, 175, 55, 0.25), rgba(163, 131, 95, 0.25)) !important;
  border-color: #D4AF37 !important;
  box-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
}

.miv-btn.highlight-media:hover {
  background: linear-gradient(135deg, rgba(212, 175, 55, 0.4), rgba(163, 131, 95, 0.4)) !important;
  border-color: #ffe066 !important;
}

.miv-badge-highlight {
  background: #D4AF37;
  color: #000;
  font-size: 9px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 4px;
  margin-right: 6px;
  text-transform: uppercase;
  flex-shrink: 0;
}

/* ================= SOLO MEDIA HIGHLIGHT ================= */
.miv-btn.highlight-solo {
  background: linear-gradient(135deg, rgba(74, 144, 226, 0.25), rgba(92, 172, 238, 0.25)) !important;
  border-color: #4A90E2 !important;
  box-shadow: 0 0 12px rgba(74, 144, 226, 0.4);
}

.miv-badge-solo {
  background: #4A90E2;
  color: #fff;
  font-size: 9px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 4px;
  margin-right: 6px;
  text-transform: uppercase;
  flex-shrink: 0;
}

/* ================= PER-POST MISSION ================= */

.post-quest-box {
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 10px;
  padding: 8px;
  margin: 8px 0;
}

.post-quest-title {
  font-size: 9px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
  display: flex;
  justify-content: space-between;
}

.pq-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 10px;
  margin-bottom: 4px;
  color: #fff;
}

.pq-row:last-child {
  margin-bottom: 0;
}

.pq-bar-bg {
  flex: 1;
  height: 4px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 10px;
  margin: 0 6px;
  overflow: hidden;
}

.pq-bar-fill {
  height: 100%;
  width: 0%;
  background: var(--accent);
  border-radius: 10px;
  transition: width 0.4s ease;
}

.pq-val {
  font-family: 'Outfit', sans-serif;
  font-weight: 600;
  font-size: 10px;
  min-width: 48px;
  text-align: right;
}

button.action-btn{
  width: 100%;
  background: rgba(255,255,255,0.15);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.2);
  padding: 7px 10px;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.3s;
  font-weight: 600;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 11px;
  margin-top: 4px;
}

button.action-btn:hover{
  background: var(--primary);
  color: #000;
}

button.action-btn.opened{
  background: rgba(46, 125, 50, 0.4) !important;
  border-color: #2E7D32 !important;
  color:#fff !important;
  transform:scale(1.02);
  transition:0.3s ease;
}

button.action-btn.opened::after{
  content:" ✓";
  font-weight:700;
}

button.miv-btn {
  width: 100%;
  padding: 8px 10px;
  font-size: 11px;
  border-radius: 8px;
  font-weight: 500;
  text-align: left;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: #fff;
  cursor: pointer;
  transition: 0.2s ease;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-family: 'Plus Jakarta Sans', sans-serif;
}

button.miv-btn span.btn-text {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}

button.miv-btn i {
  flex-shrink: 0;
  font-size: 10px;
  opacity: 0.6;
}

button.miv-btn:hover {
  background: rgba(255, 255, 255, 0.15);
  border-color: rgba(255, 255, 255, 0.25);
}

button.miv-btn.opened {
  background: rgba(46, 125, 50, 0.35) !important;
  border-color: #2E7D32 !important;
  color: #fff !important;
}

button.miv-btn.opened::after {
  content: " ✓";
  font-weight: 700;
}

.progress-section{
  width:92%;
  max-width:1200px;
  margin:25px auto 20px;
  background: var(--card);
  backdrop-filter: blur(15px);
  padding: 16px;
  border-radius: 16px;
  border: 1px solid var(--card-border);
}

.progress-label{
  font-size:12px;
  margin-bottom:6px;
  color: var(--text-muted);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.progress-label span {
  color: #fff;
  font-weight: 600;
}

.reset-btn {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #fff;
  font-size: 10px;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 6px;
  cursor: pointer;
  transition: 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.reset-btn:hover {
  background: rgba(255, 50, 50, 0.3);
  border-color: rgba(255, 50, 50, 0.5);
}

.progress-bar{
  width:100%;
  height:6px;
  background:rgba(255,255,255,0.1);
  border-radius:20px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0%;
  background:var(--accent);
  transition:width 0.5s ease;
  border-radius:20px;
}

.nav-container {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 15px;
  flex-wrap: wrap;
}

.top-btn{
  background: rgba(255,255,255,0.1);
  color: #fff;
  border: 1px solid var(--card-border);
  padding: 8px 16px;
  border-radius: 20px;
  cursor: pointer;
  transition: 0.3s;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 12px;
  font-weight: 600;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  backdrop-filter: blur(10px);
}

.top-btn:hover{
  background: rgba(255,255,255,0.2);
}

/* ใช้สไตล์ร่วมกันเพื่อให้มีขนาดเท่ากับ MIV */
button.brand-btn, button.miv-btn {
    width: 100%;
    padding: 8px 10px;
    font-size: 11px;
    border-radius: 8px;
    font-weight: 500;
    text-align: left;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #fff;
    cursor: pointer;
    transition: 0.2s ease;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: 'Plus Jakarta Sans', sans-serif;
}
  
/* ================= FLOATING INTERACTIVE WIDGET (มุมบนขวา) ================= */

.floating-widget {
  position: fixed;
  top: 15px;
  right: 15px;
  bottom: auto;
  background: rgba(18, 18, 18, 0.9);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 16px;
  width: 290px;
  padding: 14px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.6);
  z-index: 9999;
  font-family: 'Plus Jakarta Sans', sans-serif;
  animation: floatDown 0.5s ease-out;
}

@keyframes floatDown {
  0% { opacity: 0; transform: translateY(-20px); }
  100% { opacity: 1; transform: translateY(0); }
}

.widget-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.widget-title {
  font-family: 'Outfit', sans-serif;
  font-size: 13px;
  color: #fff;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
}

.widget-close {
  background: none;
  border: none;
  color: rgba(255,255,255,0.5);
  cursor: pointer;
  font-size: 13px;
  transition: 0.2s;
}
.widget-close:hover {
  color: #fff;
}

.widget-controls {
  display: flex;
  gap: 6px;
  margin-bottom: 8px;
}

.widget-platform-btn {
  flex: 1;
  padding: 5px;
  border-radius: 6px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  background: rgba(255, 255, 255, 0.05);
  color: #fff;
  cursor: pointer;
  font-size: 11px;
  transition: 0.2s;
}

.widget-platform-btn.active {
  background: var(--accent);
  color: #000;
  font-weight: 700;
}

.widget-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 5px 8px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 8px;
  margin-bottom: 6px;
  font-size: 11px;
  color: rgba(255, 255, 255, 0.8);
}

.switch {
  position: relative;
  display: inline-block;
  width: 30px;
  height: 16px;
}

.switch input { opacity: 0; width: 0; height: 0; }

.slider-toggle {
  position: absolute;
  cursor: pointer;
  top: 0; left: 0; right: 0; bottom: 0;
  background-color: rgba(255, 255, 255, 0.2);
  transition: .3s;
  border-radius: 16px;
}

.slider-toggle:before {
  position: absolute;
  content: "";
  height: 12px;
  width: 12px;
  left: 2px;
  bottom: 2px;
  background-color: #fff;
  transition: .3s;
  border-radius: 50%;
}

input:checked + .slider-toggle {
  background: var(--accent);
}

input:checked + .slider-toggle:before {
  transform: translateX(14px);
  background-color: #000;
}

.widget-caption-box {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 10px;
  padding: 8px;
  font-size: 11px;
  line-height: 1.4;
  color: #f1f1f1;
  min-height: 50px;
  max-height: 100px;
  overflow-y: auto;
  text-align: left;
  white-space: pre-wrap;
  word-break: break-word;
  margin-bottom: 6px;
}

.widget-actions {
  display: flex;
  gap: 6px;
}

.widget-btn {
  flex: 1;
  padding: 7px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  border: none;

}

}

.floating-trigger-btn {

  font-weight: 700;

  cursor: pointer;
  z-index: 998;

  align-items: center;

}

.toast {

</style>
</head>

<!-- ================= POST COUNT BREAKDOWN ================= -->
<div class="quest-container">
  <div class="quest-header">
    <div class="quest-title"><i class="fa-solid fa-layer-group" style="color:var(--accent);"></i> POST COUNT BREAKDOWN</div>
    <div style="font-size: 11px; color: var(--text-muted);">Campaign Overview</div>

  <div class="quest-grid">
    <div class="quest-card">
      <div class="quest-label">00K Posts</div>

    <div class="quest-card">
      <div class="quest-label">Brand & Official Posts</div>

    </div>
    <div class="quest-card">
      <div class="quest-label">Media & KOL</div>
      <div class="quest-values" id="countMedia">0</div>

<div id="globalSummary" style="display: none;"></div>

<!-- Container สำหรับแสดงผลแบบแบ่งโซน -->
<div id="splitContainer">
  <div class="section-container" id="linglingSectionHeader">
    <div class="section-title">00K</div>
  </div>
  <div id="linglingContent" class="grid"></div>

  <div class="section-container" id="brandSectionHeader">

      <option value="all">All Media</option>

<div class="progress-section">

      <span id="reviewCount">0 / 0</span>
    </div>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>
</div>

<!-- ================= กล่องลอยสุ่มแคปชันแบบพร้อมกดได้ทันที ================= -->
<div id="floatingCaptionWidget" class="floating-widget">
  <div class="widget-header">
    <div class="widget-title"><i class="fa-solid fa-wand-magic-sparkles" style="color:var(--accent);"></i> CK x NYFW Captions</div>
    <button class="widget-close" onclick="hideWidget()"><i class="fa-solid fa-xmark"></i></button>
  </div>

  <div class="widget-controls">
    <button class="widget-platform-btn active" onclick="setWidgetPlatform('IG', this)">IG</button>
    <button class="widget-platform-btn" onclick="setWidgetPlatform('X', this)">X</button>
  </div>

  <div class="widget-toggle">
    <span id="widgetToggleLabel">#️⃣ With Hashtag</span>
    <label class="switch">
      <input type="checkbox" id="widgetTagSwitch" checked onchange="toggleWidgetHashtags(this)">
      <span class="slider-toggle"></span>
    </label>
  </div>

  <div id="widgetCaptionDisplay" class="widget-caption-box">
    Loading....
  </div>

  <div class="widget-actions">
    <button class="widget-btn btn-random" onclick="generateWidgetCaption()"><i class="fa-solid fa-shuffle"></i> Random</button>
    <button class="widget-btn btn-copy" onclick="copyWidgetCaption()"><i class="fa-regular fa-copy"></i> Copy</button>
  </div>
</div>

<button id="floatingTriggerBtn" class="floating-trigger-btn" onclick="showWidget()">
  <i class="fa-solid fa-wand-magic-sparkles"></i> Open Captions Box
</button>

<div id="toast" class="toast">Copied to Clipboard!</div>

<script>

const POST_TARGETS = {
  likes: 1200000,
  comments: 100000,
  reposts: 60000,
  shares: 1000000,
  views: 5000000
};

let globalCaptionsData = [];
let globalHashtagData = [];
let globalRawDataset = []; 
let widgetPlatform = "IG";
let widgetIncludeHashtags = true;

const mivPages = {};
const brandPages = {};
const ITEMS_PER_PAGE = 24;

const n = t => (t || "").toLowerCase().replace(/\s|_/g, "");

function loadCaptionSourceData() {
  let rawData = null;
  if (typeof defaultData !== 'undefined') {
      rawData = defaultData;
  } else if (typeof data !== 'undefined') {
      rawData = data;
  } else if (typeof captionsData !== 'undefined') {
      rawData = captionsData;
  }

  if (rawData) {
      globalCaptionsData = rawData.captions || (Array.isArray(rawData) ? rawData : []);
      globalHashtagData = rawData.hashtags || [];
  }
}

function hideWidget() {
  document.getElementById('floatingCaptionWidget').style.display = 'none';
  document.getElementById('floatingTriggerBtn').style.display = 'flex';
}

function showWidget() {
  document.getElementById('floatingCaptionWidget').style.display = 'block';
  document.getElementById('floatingTriggerBtn').style.display = 'none';
  generateWidgetCaption();
}

function setWidgetPlatform(p, btn) {
  widgetPlatform = p;
  document.querySelectorAll(".widget-platform-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  generateWidgetCaption();
}

function toggleWidgetHashtags(checkbox) {
  widgetIncludeHashtags = checkbox.checked;
  const label = document.getElementById("widgetToggleLabel");
  if (widgetIncludeHashtags) {
    label.innerHTML = "#️⃣ With Hashtag";
  } else {
    label.innerHTML = "❌ No Hashtag";
  }
  generateWidgetCaption();
}

function generateWidgetCaption() {
  loadCaptionSourceData();
  const display = document.getElementById('widgetCaptionDisplay');
  
  const filtered = globalCaptionsData.filter(c => 
    n(c.brand) === n("CalvinKlein") && n(c.campaign) === n("NYFW")
  ).map(c => c.caption);

  if (!filtered || filtered.length === 0) {
    display.innerText = "No Fonud Captions for CalvinKlein Campaign NYFW in data";
    return;
  }

  const randomCap = filtered[Math.floor(Math.random() * filtered.length)];
  let finalResult = randomCap;

  if (widgetIncludeHashtags) {
    const tags = globalHashtagData.find(h => 
      n(h.brand) === n("CalvinKlein") && n(h.campaign) === n("NYFW") && n(h.platform) === n(widgetPlatform)
    );
    if (tags && tags.hashtags) {
      finalResult += "\n\n" + tags.hashtags;
    }
  }

  display.innerText = finalResult;
}

function copyWidgetCaption() {
  const text = document.getElementById('widgetCaptionDisplay').innerText;
  if (!text || text.includes("No Found")) return;
  
  navigator.clipboard.writeText(text).then(() => {
    const toast = document.getElementById("toast");
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2000);
  });
}

document.addEventListener("DOMContentLoaded", () => {
  loadCaptionSourceData();
  generateWidgetCaption();
});

let currentType="all";

function switchType(type){
  currentType=type;

  document.querySelectorAll(".type-tabs button")
    .forEach(btn=>btn.classList.remove("active"));

  if(type==="lingling"){
    document.getElementById("tabLingling").classList.add("active");
    document.body.setAttribute("data-theme","artist");
  }
  else if(type==="brand"){
    document.getElementById("tabBrand").classList.add("active");
    document.body.setAttribute("data-theme","artist");
  }
  else if(type==="media"){
    document.getElementById("tabMedia").classList.add("active");
    document.body.setAttribute("data-theme","media");
  }
  else{
    document.getElementById("tabAll").classList.add("active");
    document.body.removeAttribute("data-theme");
  }

  loadData();
}

let player;
let playerReady = false;

function onYouTubeIframeAPIReady() {
  player = new YT.Player('bgMusic', {
    events: {
      'onReady': function() {
        playerReady = true;
      }
    }
  });
}

function playMusic(){
  if(playerReady){
    player.playVideo();
  } else {
    console.log("Player not ready yet");
  }
}

const API_URL="https://script.google.com/macros/s/AKfycbwjMsnfM7vZOJ-OE84YwzLDrW4MrwJLUWSJHWsTIQ-hT5207IDRwePavF_JkAfoRQLw/exec";

function loadData(){
  const linglingCont = document.getElementById("linglingContent");
  const brandCont = document.getElementById("brandContent");
  const mediaCont = document.getElementById("mediaContent");
  
  if(linglingCont.innerHTML === "" && brandCont.innerHTML === "" && mediaCont.innerHTML === "") {
    linglingCont.innerHTML = `
      <div class="empty-state">
        <div class="spinner"></div>
        <h3>Loading Campaign Data...</h3>
        <p>Loading.....</p>
      </div>
    `;
  }

  fetch(API_URL)
  .then(res=>res.json())
  .then(data=>{
    data.forEach(p=>{
      if(!p.sheetType){
        p.sheetType = "artist";
      }
    });
    globalRawDataset = data;
    populatePlatformFilter(data);
    render(data);
  })
  .catch(err => {
    linglingCont.innerHTML = `
      <div class="empty-state">
        <h3>Awaiting Data Connection</h3>
        <p>No Found Data</p>
      </div>
    `;
    brandCont.innerHTML = "";
    mediaCont.innerHTML = "";
  });
}

function populatePlatformFilter(data){
  const select=document.getElementById("platformFilter");
  const currentValue=select.value;
  select.innerHTML='<option value="all">All Platforms</option>';
  const platforms=[...new Set(data.map(p=>p.platform?.trim()))];
  platforms.forEach(p=>{
    if(!p)return;
    const option=document.createElement("option");
    option.value=p;
    option.textContent=p;
    select.appendChild(option);
  });
  select.value=currentValue||"all";
}

function classifySubCategory(p) {
  const tabName = (p.sheetTab || p.sourceTab || p.tabName || "").toString().trim().toLowerCase();
  if (tabName.includes("media") || tabName.includes("kol")) {
    return "media";
  }

  const type = (p.sheetType || "").toString().trim().toLowerCase();
  if (type === "media") return "media";
  if (type === "brand" || type.includes("brand")) return "brand";
  
  const name = (p.post_name || "").toLowerCase().replace(/\s+/g, "");
  if (name.includes("linglingkwong") || name.includes("lingsirilak") || name.includes("CalvinKlein")) {
    return "lingling";
  }
  
  return "brand"; 
}

const platformOrder = ["IG", "Instagram", "X", "Twitter", "Facebook", "FB", "Tiktok", "Thread", "Threads"];

function sortDataByPlatform(data) {
  return data.sort((a, b) => {
    let platA = (a.platform || "").toLowerCase();
    let platB = (b.platform || "").toLowerCase();
    
    let indexA = platformOrder.findIndex(p => platA.includes(p.toLowerCase()));
    let indexB = platformOrder.findIndex(p => platB.includes(p.toLowerCase()));
    
    if (indexA === -1) indexA = 999;
    if (indexB === -1) indexB = 999;
    
    return indexA - indexB;
  });
}

function render(data){

  const selectedPlatform=document.getElementById("platformFilter").value;
  const sort=document.getElementById("sortSelect").value;

  const uniqueMap = new Map();
  data.forEach(p => {
    if(!p.sheetType){
      p.sheetType = "artist";
    }
    const linkKey = String(p.link || "").trim();
    if (linkKey && !uniqueMap.has(linkKey)) {
      uniqueMap.set(linkKey, p);
    }
  });
  data = Array.from(uniqueMap.values());

  renderSummary(data);

  let processedData = [...data];

  if(sort === "sheet_desc" || sort === "default" || !sort){
    processedData.reverse();
  }

  if(selectedPlatform!=="all"){
    processedData=processedData.filter(p=>p.platform===selectedPlatform);
  }

  processedData.forEach(p=>{
    p.eng =
      Number(p.likes||0) +
      Number(p.comments||0) +
      Number(p.shares||0) +
      Number(p.reposts||0);
  });

  const sortFunc = (a, b) => {
    switch(sort){
      case "eng_desc": return b.eng - a.eng;
      case "eng_asc": return a.eng - b.eng;
      case "sheet_asc": return -1;
      case "sheet_desc": 
      default: return 0;
    }
  };

  let linglingData = processedData.filter(p => classifySubCategory(p) === "lingling");
  let brandData = processedData.filter(p => classifySubCategory(p) === "brand");
  let mediaData = processedData.filter(p => classifySubCategory(p) === "media");

  if(sort === "eng_desc" || sort === "eng_asc") {
    linglingData.sort(sortFunc);
    brandData.sort(sortFunc);
    mediaData.sort(sortFunc);
  } else {
    sortDataByPlatform(linglingData);
    sortDataByPlatform(brandData);
  }

  const linglingHeader = document.getElementById("linglingSectionHeader");
  const linglingContent = document.getElementById("linglingContent");
  const brandHeader = document.getElementById("brandSectionHeader");
  const brandContent = document.getElementById("brandContent");
  const mediaHeader = document.getElementById("mediaSectionHeader");
  const mediaCont = document.getElementById("mediaContent");

  if(currentType === "lingling"){
    linglingHeader.style.display = "block";
    linglingContent.style.display = "grid";
    brandHeader.style.display = "none";
    brandContent.style.display = "none";
    mediaHeader.style.display = "none";
    brandContent.innerHTML = "";
    mediaCont.innerHTML = "";
    renderCards(linglingData, "linglingContent", false, "lingling");
  } else if(currentType === "brand"){
    linglingHeader.style.display = "none";
    linglingContent.style.display = "none";
    brandHeader.style.display = "block";
    brandContent.style.display = "block";
    mediaHeader.style.display = "none";
    linglingContent.innerHTML = "";
    mediaCont.innerHTML = "";
    renderGroupedBrand(brandData, brandContent);
  } else if(currentType === "media"){
    linglingHeader.style.display = "none";
    linglingContent.style.display = "none";
    brandHeader.style.display = "none";
    brandContent.style.display = "none";
    mediaHeader.style.display = "flex";
    linglingContent.innerHTML = "";
    brandContent.innerHTML = "";
    renderGroupedMedia(mediaData, mediaCont);
  } else {
    linglingHeader.style.display = "block";
    linglingContent.style.display = "grid";
    brandHeader.style.display = "block";
    brandContent.style.display = "block";
    mediaHeader.style.display = "flex";
    renderCards(linglingData, "linglingContent", false, "lingling");
    renderGroupedBrand(brandData, brandContent);
    renderGroupedMedia(mediaData, mediaCont);
  }

  updateProgress();
}

function renderSummary(dataset){
  let linglingCount = 0;
  let brandCount = 0;
  let mediaCount = 0;

  dataset.forEach(p => {
    const sub = classifySubCategory(p);
    if(sub === "lingling") linglingCount++;
    else if(sub === "brand") brandCount++;
    else if(sub === "media") mediaCount++;
  });

  if(document.getElementById("countLingling")) {
    document.getElementById("countLingling").innerText = linglingCount.toLocaleString();
    document.getElementById("countBrand").innerText = brandCount.toLocaleString();
    document.getElementById("countMedia").innerText = mediaCount.toLocaleString();
  }
}

function getPlatformIcon(platform){
  if(!platform) return "";
  const p = platform.toLowerCase();
  if(p.includes("tiktok")){
    return "https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/tiktok.svg";
  }
  if(p.includes("instagram") || p.includes("ig")){
    return "https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/instagram.svg";
  }
  if(p === "facebook" || p === "fb"){
    return "https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/facebook.svg";
  }
  if(p === "x" || p.includes("twitter")){
    return "https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/x.svg";
  }
  return "";
}

function getReviewedPosts(){
  return JSON.parse(localStorage.getItem("reviewedPosts") || "[]");
}

function saveReviewedPosts(list){
  localStorage.setItem("reviewedPosts", JSON.stringify(list));
}

function markAsReviewed(id){
  let reviewed = getReviewedPosts();
  if(!reviewed.includes(id)){
    reviewed.push(id);
    saveReviewedPosts(reviewed);
  }
  updateProgressVisuals();
}

function resetProgress() {
  if (confirm("คุณต้องการรีเซ็ตสถานะการเปิดโพสต์ทั้งหมดใช่หรือไม่?")) {
    localStorage.removeItem("reviewedPosts");
    updateProgressVisuals();
    loadData();
  }
}

function handleOpen(element, link, postId){
  window.open(link,'_blank');
  markAsReviewed(postId);
  element.classList.add("opened");
  const btn = element.querySelector("button.action-btn");
  if(btn) btn.classList.add("opened");
}

function updateProgressVisuals(){
  const reviewed = getReviewedPosts();
  let totalPosts = globalRawDataset.length;
  let reviewedCount = globalRawDataset.filter(p => reviewed.includes(p.link)).length;

  document.getElementById("reviewCount").innerText = reviewedCount + " / " + totalPosts;

  const percent = totalPosts ? (reviewedCount / totalPosts) * 100 : 0;
  document.getElementById("progressFill").style.width = percent + "%";
}

function updateProgress(){
  updateProgressVisuals();
}

function createPostQuestHTML(p) {
  const metrics = [
    { key: 'likes', label: 'Likes', val: Number(p.likes || 0) },
    { key: 'comments', label: 'Comments', val: Number(p.comments || 0) },
    { key: 'reposts', label: 'Reposts', val: Number(p.reposts || 0) },
    { key: 'shares', label: 'Shared', val: Number(p.shares || 0) },
    { key: 'views', label: 'Views', val: Number(p.views || 0) }
  ];

  let rowsHTML = "";
  metrics.forEach(m => {
    const target = POST_TARGETS[m.key];
    let pct = (m.val / target) * 100;
    if (pct > 100) pct = 100;

    rowsHTML += `
      <div class="pq-row">
        <span>${m.label}</span>
        <div class="pq-bar-bg">
          <div class="pq-bar-fill" style="width: ${pct}%"></div>
        </div>
        <span class="pq-val">${m.val.toLocaleString()}/${target.toLocaleString()}</span>
      </div>
    `;
  });

  return `
    <div class="post-quest-box">
      <div class="post-quest-title">
        <span>🎯 Post Target Mission</span>
        <span>${((metrics.reduce((acc, m) => acc + Math.min((m.val / POST_TARGETS[m.key]) * 100, 100), 0)) / 5).toFixed(0)}%</span>
      </div>
      ${rowsHTML}
    </div>
  `;
}

function renderCards(data, containerId, isCompact, categoryType){
  const container=document.getElementById(containerId);
  container.innerHTML="";
  const reviewed = getReviewedPosts();

  if(!data || data.length===0){
    container.innerHTML=`
      <div class="empty-state">
        <h3>No Posts Found</h3>
        <p>No Post Found</p>
      </div>
    `;
    return;
  }

  data.forEach(p=>{
    const postId = p.link;
    const isOpened = reviewed.includes(postId);
    const iconURL = getPlatformIcon(p.platform);

    const titleHTML = `
      <div class="platform-title">
        ${iconURL ? `<img class="platform-icon" src="${iconURL}">` : ""}
        <span>${p.post_name||''}</span>
      </div>
    `;

    const imageHTML = p.thumbnail ? `<img class="post-img" src="${p.thumbnail || ''}">` : "";
    const postQuestHTML = createPostQuestHTML(p);

    container.innerHTML += `
      <div class="card">
        <div>
          ${imageHTML}
          <div class="badge artist">00K</div>
          ${titleHTML}
          ${postQuestHTML}
        </div>
        <button class="action-btn ${isOpened ? "opened" : ""}" onclick="handleOpen(this, '${p.link}', '${postId}')">
          ${isOpened ? "Opened" : "Open Post"}
        </button>
      </div>
    `;
  });
}

function changeBrandPage(platformKey, page) {
  brandPages[platformKey] = page;
  loadData();
}

function changeMivPage(platformKey, newPage) {
  mivPages[platformKey] = newPage;
  loadData(); 
}

function renderGroupedBrand(data, container) {
  container.innerHTML = "";
  const reviewed = getReviewedPosts();

  if (!data || data.length === 0) {
    container.innerHTML = `
      <div class="empty-state" style="width: 92%; margin: 0 auto;">
        <h3>No Posts Found</h3>
        <p>No Posts Found</p>
      </div>
    `;
    return;
  }

  const groups = {};
  data.forEach(p => {
    const plat = (p.platform || "Other").trim();
    if (!groups[plat]) groups[plat] = [];
    groups[plat].push(p);
  });

  const sortedPlatforms = Object.keys(groups).sort((a, b) => {
    let platA = a.toLowerCase();
    let platB = b.toLowerCase();
    let indexA = platformOrder.findIndex(p => platA.includes(p.toLowerCase()));
    let indexB = platformOrder.findIndex(p => platB.includes(p.toLowerCase()));
    if (indexA === -1) indexA = 999;
    if (indexB === -1) indexB = 999;
    return indexA - indexB;
  });

  sortedPlatforms.forEach(platformName => {
    let posts = groups[platformName];
    const platformKey = "brand_" + n(platformName);

    if (!brandPages[platformKey]) brandPages[platformKey] = 1;
    const totalPages = Math.ceil(posts.length / ITEMS_PER_PAGE);
    if (brandPages[platformKey] > totalPages) brandPages[platformKey] = totalPages || 1;

    const currentPage = brandPages[platformKey];
    const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
    const currentPosts = posts.slice(startIndex, startIndex + ITEMS_PER_PAGE);

    const subContainer = document.createElement("div");
    subContainer.className = "platform-sub-container";

    let buttonsHTML = "";
    currentPosts.forEach(p => {
      const postId = p.link;
      const isOpened = reviewed.includes(postId);
      const postName = p.post_name || "Brand Post";

      buttonsHTML += `
        <button 
          class="miv-btn ${isOpened ? "opened" : ""}"
          onclick="handleOpen(this,'${p.link}','${postId}')"
          title="${postName}">
          <span class="badge brand" style="margin:0; font-size:9px; padding:2px 6px;">BRAND</span>
          <span class="btn-text">${postName}</span>
          <i class="fa-solid fa-arrow-up-right-from-square"></i>
        </button>
      `;
    });

    let paginationHTML = "";
    if (totalPages > 1) {
      paginationHTML += `<div class="pagination">`;
      paginationHTML += `<button class="page-btn" ${currentPage === 1 ? "disabled" : ""} onclick="changeBrandPage('${platformKey}', ${currentPage - 1})"><i class="fa-solid fa-chevron-left"></i></button>`;
      
      for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
          paginationHTML += `<button class="page-btn ${i === currentPage ? "active" : ""}" onclick="changeBrandPage('${platformKey}', ${i})">${i}</button>`;
        } else if (i === currentPage - 2 || i === currentPage + 2) {
          paginationHTML += `<span style="color:#fff; font-size:11px;">...</span>`;
        }
      }

      paginationHTML += `<button class="page-btn" ${currentPage === totalPages ? "disabled" : ""} onclick="changeBrandPage('${platformKey}', ${currentPage + 1})"><i class="fa-solid fa-chevron-right"></i></button>`;
      paginationHTML += `</div>`;
    }

    subContainer.innerHTML = `
      <div class="platform-sub-title">
        <span>Brand & Official - ${platformName} (${posts.length} posts)</span>
      </div>
      <div class="grid-compact">
        ${buttonsHTML}
      </div>
      ${paginationHTML}
    `;

    container.appendChild(subContainer);
  });
}

function renderGroupedMedia(data, container) {
  container.innerHTML = "";

  const reviewed = getReviewedPosts();
  const soloFilterVal = document.getElementById("soloFilter") ? document.getElementById("soloFilter").value : "all";

  if (soloFilterVal === "solo") {
    data = data.filter(p => {
      const isSolo = String(p.is_solo || "").trim().toLowerCase() === "true" || 
                     String(p.is_solo || "").trim() === "1" || 
                     String(p.is_solo || "").trim().toLowerCase() === "yes";
      return isSolo;
    });
  }

  if (!data || data.length === 0) {
    container.innerHTML = `
      <div class="empty-state" style="width: 92%; margin: 0 auto;">
        <h3>No Posts Found</h3>
        <p>No Posts Found</p>
      </div>
    `;
    return;
  }

  const groups = {};
  data.forEach(p => {
    const plat = (p.platform || "Other").trim();
    if (!groups[plat]) {
      groups[plat] = [];
    }
    groups[plat].push(p);
  });

  const sortedPlatforms = Object.keys(groups).sort((a, b) => {
    let platA = a.toLowerCase();
    let platB = b.toLowerCase();
    
    let indexA = platformOrder.findIndex(p => platA.includes(p.toLowerCase()));
    let indexB = platformOrder.findIndex(p => platB.includes(p.toLowerCase()));
    
    if (indexA === -1) indexA = 999;
    if (indexB === -1) indexB = 999;
    
    return indexA - indexB;
  });

  sortedPlatforms.forEach(platformName => {
    let posts = groups[platformName];
    const platformKey = n(platformName);

    posts.sort((a, b) => {
      const aImp = String(a.is_important || "").trim().toLowerCase() === "true" || String(a.is_important || "").trim() === "1" || String(a.is_important || "").trim().toLowerCase() === "yes";
      const bImp = String(b.is_important || "").trim().toLowerCase() === "true" || String(b.is_important || "").trim() === "1" || String(b.is_important || "").trim().toLowerCase() === "yes";
      
      if (aImp && !bImp) return -1;
      if (!aImp && bImp) return 1;
      return 0;
    });

    if (!mivPages[platformKey]) {
      mivPages[platformKey] = 1;
    }

    const totalPages = Math.ceil(posts.length / ITEMS_PER_PAGE);
    if (mivPages[platformKey] > totalPages) {
      mivPages[platformKey] = totalPages || 1;
    }

    const currentPage = mivPages[platformKey];
    const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
    const currentPosts = posts.slice(startIndex, startIndex + ITEMS_PER_PAGE);

    const subContainer = document.createElement("div");
    subContainer.className = "platform-sub-container";

    let buttonsHTML = "";
    currentPosts.forEach(p => {
      const postId = p.link;
      const isOpened = reviewed.includes(postId);
      const postName = p.post_name || "Open Post";

      const isImportant = String(p.is_important || "").trim().toLowerCase() === "true" || 
                          String(p.is_important || "").trim() === "1" || 
                          String(p.is_important || "").trim().toLowerCase() === "yes";

      const isSolo = String(p.is_solo || "").trim().toLowerCase() === "true" || 
                     String(p.is_solo || "").trim() === "1" || 
                     String(p.is_solo || "").trim().toLowerCase() === "yes";

      let badgeHTML = "";
      let btnClassExtra = "";

      if (isImportant) {
        badgeHTML = '<span class="miv-badge-highlight">BOOST!</span>';
        btnClassExtra = "highlight-media";
      } else if (isSolo) {
        badgeHTML = '<span class="miv-badge-solo">SOLO</span>';
        btnClassExtra = "highlight-solo";
      }

      buttonsHTML += `
        <button 
          class="miv-btn ${isOpened ? "opened" : ""} ${btnClassExtra}"
          onclick="handleOpen(this,'${p.link}','${postId}')"
          title="${postName}">
          ${badgeHTML}
          <span class="btn-text">${postName}</span>
          <i class="fa-solid fa-arrow-up-right-from-square"></i>
        </button>
      `;
    });

    let paginationHTML = "";
    if (totalPages > 1) {
      paginationHTML += `<div class="pagination">`;
      paginationHTML += `<button class="page-btn" ${currentPage === 1 ? "disabled" : ""} onclick="changePage('${platformKey}', ${currentPage - 1})"><i class="fa-solid fa-chevron-left"></i></button>`;
      
      for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
          paginationHTML += `<button class="page-btn ${i === currentPage ? "active" : ""}" onclick="changePage('${platformKey}', ${i})">${i}</button>`;
        } else if (i === currentPage - 2 || i === currentPage + 2) {
          paginationHTML += `<span style="color:#fff; font-size:11px;">...</span>`;
        }
      }

      paginationHTML += `<button class="page-btn" ${currentPage === totalPages ? "disabled" : ""} onclick="changePage('${platformKey}', ${currentPage + 1})"><i class="fa-solid fa-chevron-right"></i></button>`;
      paginationHTML += `</div>`;
    }

    subContainer.innerHTML = `
      <div class="platform-sub-title">
        <span>${platformName} (${posts.length} posts)</span>
      </div>
      <div class="grid-compact">
        ${buttonsHTML}
      </div>
      ${paginationHTML}
    `;

    container.appendChild(subContainer);
  });
}

function changePage(platformKey, page) {
  mivPages[platformKey] = page;
  loadData();
}

loadData();
setInterval(loadData, 60000);

</script>
