<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>00K Engagement - Calvin Klein x NYFW</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<script src="data.js?v=8"></script>

<style>

/* ================= THEME SYSTEM ================= */

:root{
  --primary:#ffffff;
  --accent:#A3835F;
  --bg-overlay: rgba(0,0,0,0.5);
  --card:rgba(255, 255, 255, 0.07);
  --card-border:rgba(255, 255, 255, 0.12);
  --text-main:#ffffff;
  --text-muted:rgba(255, 255, 255, 0.7);
}

body{
  margin:0;
  color:var(--text-main);
  font-family:'Plus Jakarta Sans',sans-serif;
  background-color:#000;
  background-image:linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url("https://lingigupdate-code.github.io/00k-Caption/image/CKNYFW.jpg");
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  min-height:100vh;
  transition:0.4s ease;
}

/* Artist Theme */
body[data-theme="artist"]{
  --accent:#C5A059;
}

/* Media Theme */
body[data-theme="media"]{
  --accent:#8B7355;
}

/* ================= HEADER ================= */

.header{
  text-align:center;
  padding:40px 20px 10px;
}
.header h1{
  font-family:'Outfit',sans-serif;
  font-weight:700;
  font-size:32px;
  letter-spacing:2px;
  color:var(--primary);
  margin:0;
  text-shadow: 0 2px 10px rgba(0,0,0,0.5);
}
.header p{
  font-size:13px;
  color:var(--text-muted);
  letter-spacing:2px;
  margin-top:8px;
  text-transform: uppercase;
}

/* ================= TYPE TABS ================= */

.type-tabs{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-bottom:25px;
}

.type-tabs button{
  padding:10px 20px;
  border-radius:30px;
  border:1px solid var(--card-border);
  background:rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(10px);
  color:var(--text-muted);
  cursor:pointer;
  font-weight:600;
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size: 13px;
  transition:0.3s;
}

.type-tabs button:hover{
  background:rgba(255, 255, 255, 0.15);
  color:#fff;
}

.type-tabs button.active{
  background:var(--primary);
  color:#000;
  border-color:var(--primary);
}

/* ================= CONTROLS ================= */

.controls{
  display:flex;
  justify-content:center;
  gap:15px;
  margin:20px 0 30px;
  flex-wrap:wrap;
}

select{
  padding:10px 16px;
  border-radius:12px;
  border:1px solid var(--card-border);
  background:rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(10px);
  color:#fff;
  font-weight:500;
  font-family:'Plus Jakarta Sans',sans-serif;
  outline: none;
  cursor: pointer;
}

select option {
  background: #111;
  color: #fff;
}

/* ================= TARGET QUEST / MISSION DASHBOARD ================= */

.quest-container {
  width: 90%;
  max-width: 1200px;
  margin: 0 auto 30px;
  background: var(--card);
  backdrop-filter: blur(15px);
  border: 1px solid var(--card-border);
  border-radius: 20px;
  padding: 24px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.25);
}

.quest-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.quest-title {
  font-family: 'Outfit', sans-serif;
  font-size: 18px;
  font-weight: 700;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 8px;
}

.quest-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 15px;
}

@media(max-width: 1024px) {
  .quest-grid { grid-template-columns: repeat(3, 1fr); }
}
@media(max-width: 650px) {
  .quest-grid { grid-template-columns: repeat(3, 1fr); }
}

.quest-card {
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 14px;
  padding: 15px;
  text-align: center;
  position: relative;
  overflow: hidden;
  transition: 0.3s;
}

.quest-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--text-muted);
  margin-bottom: 6px;
  text-transform: uppercase;
}

.quest-values {
  font-family: 'Outfit', sans-serif;
  font-size: 16px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 4px;
}

/* ================= SUMMARY ================= */

.summary{
  width:90%;
  max-width:1200px;
  margin:0 auto 30px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
}

@media(max-width:768px){ .summary{grid-template-columns:repeat(2,1fr);} }

.summary-item{
  background:var(--card);
  backdrop-filter: blur(15px);
  padding:20px;
  border-radius:16px;
  border:1px solid var(--card-border);
  text-align:center;
  transition:0.3s;
  box-shadow: 0 8px 32px rgba(0,0,0,0.2);
}

.summary-item h3{
  font-size:11px;
  letter-spacing:1px;
  color:var(--text-muted);
  margin:0 0 8px 0;
}

.summary-item .number{
  font-size:22px;
  font-weight:700;
  font-family:'Outfit',sans-serif;
  color:var(--accent);
  transition:0.3s;
}

/* ================= SECTION HEADINGS ================= */

.section-container {
  width: 90%;
  max-width: 1200px;
  margin: 40px auto 10px;
}

.section-title {
  font-family: 'Outfit', sans-serif;
  font-size: 20px;
  font-weight: 700;
  color: #fff;
  border-left: 4px solid var(--accent);
  padding-left: 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
}

/* Sub-section for Platform inside MIV */
.platform-sub-container {
  width: 90%;
  max-width: 1200px;
  margin: 15px auto 25px;
}

.platform-sub-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* ================= GRID & CARDS ================= */

.grid{
  width:90%;
  max-width:1200px;
  margin:15px auto 30px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:25px;
}

@media(max-width:900px){ .grid{grid-template-columns:repeat(2,1fr);} }
@media(max-width:600px){ .grid{grid-template-columns:1fr;} }

/* Compact Grid for MIV / Media */
.grid-compact {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

@media(max-width:1024px){ .grid-compact{grid-template-columns:repeat(3,1fr);} }
@media(max-width:768px){ .grid-compact{grid-template-columns:repeat(2,1fr);} }
@media(max-width:480px){ .grid-compact{grid-template-columns:1fr;} }

.card{
  background:var(--card);
  backdrop-filter: blur(15px);
  border:1px solid var(--card-border);
  border-radius:20px;
  padding:20px;
  transition:0.3s;
  box-shadow: 0 12px 40px rgba(0,0,0,0.25);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

/* Compact Card Styling for MIV */
.card.compact-card {
  padding: 14px;
  border-radius: 14px;
  border-left: 3px solid var(--accent);
}

.card:hover{
  transform:translateY(-5px);
  box-shadow:0 15px 35px rgba(0,0,0,0.4);
  border-color: rgba(255,255,255,0.25);
}

.empty-state{
  grid-column: 1 / -1;
  background: var(--card);
  backdrop-filter: blur(15px);
  border: 2px dashed var(--card-border);
  border-radius: 20px;
  padding: 40px 20px;
  text-align: center;
  color: var(--text-muted);
}

.empty-state h3{
  font-size: 16px;
  color: #fff;
  margin-bottom: 6px;
  font-family:'Outfit',sans-serif;
}

.empty-state p{
  font-size: 13px;
  margin: 0;
}

.spinner{
  width: 32px;
  height: 32px;
  border: 3px solid rgba(255,255,255,0.1);
  border-top: 3px solid var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 15px;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.card.media-card{
  border-left:4px solid var(--accent);
  padding-top:22px;
}

.card.media-card h3{
  font-size:16px;
  line-height:1.4;
  font-weight:600;
}

.post-img{
  width:100%;
  border-radius:14px;
  aspect-ratio:4/5;
  object-fit:cover;
  margin-bottom:12px;
  border: 1px solid rgba(255,255,255,0.1);
}

.badge{
  display:inline-block;
  padding:4px 12px;
  border-radius:20px;
  font-size:11px;
  font-weight:600;
  margin-bottom:10px;
  color:#fff;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.1);
}

.badge.artist{
  background:var(--accent);
  color:#000;
}

.badge.media{
  background:rgba(255,255,255,0.15);
}

.platform-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
  font-size: 15px;
  margin-bottom: 12px;
  color: #fff;
}

.compact-card .platform-title {
  font-size: 13px;
  margin-bottom: 8px;
}

.platform-icon {
  width: 16px;
  height: 16px;
  filter: brightness(0) invert(1);
}

.stats{
  font-size:12px;
  margin:8px 0;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  color: var(--text-muted);
}

/* ================= PER-POST MISSION ================= */

.post-quest-box {
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 12px;
  padding: 10px;
  margin: 10px 0;
}

.post-quest-title {
  font-size: 10px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
}

.pq-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  margin-bottom: 6px;
  color: #fff;
}

.pq-row:last-child {
  margin-bottom: 0;
}

.pq-bar-bg {
  flex: 1;
  height: 5px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 10px;
  margin: 0 8px;
  overflow: hidden;
}

.pq-bar-fill {
  height: 100%;
  width: 0%;
  background: var(--accent);
  border-radius: 10px;
  transition: width 0.4s ease;
}

.pq-val {
  font-family: 'Outfit', sans-serif;
  font-weight: 600;
  font-size: 11px;
  min-width: 55px;
  text-align: right;
}

button.action-btn{
  width: 100%;
  background: rgba(255,255,255,0.15);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.2);
  padding: 10px 14px;
  border-radius: 12px;
  cursor: pointer;
  transition: 0.3s;
  font-weight: 600;
  font-family: 'Plus Jakarta Sans', sans-serif;
  margin-top: 5px;
}

.compact-card button.action-btn {
  padding: 7px 10px;
  font-size: 11px;
  border-radius: 8px;
  margin-top: 8px;
}

button.action-btn:hover{
  background: var(--primary);
  color: #000;
}

button.action-btn.opened{
  background: rgba(46, 125, 50, 0.4) !important;
  border-color: #2E7D32 !important;
  color:#fff !important;
  transform:scale(1.02);
  transition:0.3s ease;
}

button.action-btn.opened::after{
  content:" ✓";
  font-weight:700;
}

.progress-section{
  width:90%;
  max-width:1200px;
  margin:30px auto 20px;
  background: var(--card);
  backdrop-filter: blur(15px);
  padding: 20px;
  border-radius: 20px;
  border: 1px solid var(--card-border);
}

.progress-label{
  font-size:13px;
  margin-bottom:8px;
  color: var(--text-muted);
  display: flex;
  justify-content: space-between;
}

.progress-label span {
  color: #fff;
  font-weight: 600;
}

.progress-bar{
  width:100%;
  height:8px;
  background:rgba(255,255,255,0.1);
  border-radius:20px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0%;
  background:var(--accent);
  transition:width 0.5s ease;
  border-radius:20px;
}

.nav-container {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.top-btn{
  background: rgba(255,255,255,0.1);
  color: #fff;
  border: 1px solid var(--card-border);
  padding: 10px 20px;
  border-radius: 30px;
  cursor: pointer;
  transition: 0.3s;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  backdrop-filter: blur(10px);
}

.top-btn:hover{
  background: rgba(255,255,255,0.2);
}

/* ================= FLOATING INTERACTIVE WIDGET ================= */

.floating-widget {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: rgba(18, 18, 18, 0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 20px;
  width: 320px;
  padding: 16px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.6);
  z-index: 9999;
  font-family: 'Plus Jakarta Sans', sans-serif;
  animation: floatUp 0.5s ease-out;
}

@keyframes floatUp {
  0% { opacity: 0; transform: translateY(30px); }
  100% { opacity: 1; transform: translateY(0); }
}

.widget-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

.widget-title {
  font-family: 'Outfit', sans-serif;
  font-size: 14px;
  color: #fff;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
}

.widget-close {
  background: none;
  border: none;
  color: rgba(255,255,255,0.5);
  cursor: pointer;
  font-size: 14px;
  transition: 0.2s;
}
.widget-close:hover {
  color: #fff;
}

.widget-controls {
  display: flex;
  gap: 6px;
  margin-bottom: 8px;
}

.widget-platform-btn {
  flex: 1;
  padding: 6px;
  border-radius: 8px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  background: rgba(255, 255, 255, 0.05);
  color: #fff;
  cursor: pointer;
  font-size: 11px;
  transition: 0.2s;
}

.widget-platform-btn.active {
  background: var(--accent);
  color: #000;
  font-weight: 700;
}

.widget-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 10px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 10px;
  margin-bottom: 8px;
  font-size: 11px;
  color: rgba(255, 255, 255, 0.8);
}

.switch {
  position: relative;
  display: inline-block;
  width: 34px;
  height: 18px;
}

.switch input { opacity: 0; width: 0; height: 0; }

.slider-toggle {
  position: absolute;
  cursor: pointer;
  top: 0; left: 0; right: 0; bottom: 0;
  background-color: rgba(255, 255, 255, 0.2);
  transition: .3s;
  border-radius: 18px;
}

.slider-toggle:before {
  position: absolute;
  content: "";
  height: 14px;
  width: 14px;
  left: 2px;
  bottom: 2px;
  background-color: #fff;
  transition: .3s;
  border-radius: 50%;
}

input:checked + .slider-toggle {
  background: var(--accent);
}

input:checked + .slider-toggle:before {
  transform: translateX(16px);
  background-color: #000;
}

.widget-caption-box {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  padding: 10px;
  font-size: 12px;
  line-height: 1.5;
  color: #f1f1f1;
  min-height: 60px;
  max-height: 120px;
  overflow-y: auto;
  text-align: left;
  white-space: pre-wrap;
  word-break: break-word;
  margin-bottom: 8px;
}

.widget-actions {
  display: flex;
  gap: 6px;
}

.widget-btn {
  flex: 1;
  padding: 8px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  font-family: 'Plus Jakarta Sans', sans-serif;
  transition: 0.2s;
}

.btn-random {
  background: var(--accent);
  color: #000;
}
.btn-random:hover { filter: brightness(1.15); }

.btn-copy {
  background: rgba(255, 255, 255, 0.15);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.2);
}
.btn-copy:hover { background: rgba(255, 255, 255, 0.25); }

.floating-trigger-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: var(--accent);
  color: #000;
  border: none;
  border-radius: 50px;
  padding: 12px 18px;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 700;
  font-size: 13px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  cursor: pointer;
  z-index: 998;
  display: none;
  align-items: center;
  gap: 6px;
  transition: 0.3s;
}
.floating-trigger-btn:hover {
  transform: scale(1.05);
}

.toast { 
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); 
  background: var(--accent); color: #000; padding: 10px 20px; border-radius: 20px; 
  font-weight: 600; opacity: 0; transition: 0.3s; pointer-events: none; z-index: 10000; 
}
.toast.show { opacity: 1; }

</style>
</head>

<body>

<div class="header">
  <h1>00K ENGAGEMENT</h1>
  <p>CALVIN KLEIN x NYFW</p>
</div>

<div class="nav-container" style="margin-top: 15px;">
  <button class="top-btn" onclick="playMusic()"><i class="fa-solid fa-play"></i> Play Music</button>
  <a href="index.html" class="top-btn"><i class="fa-solid fa-arrow-left"></i> Back Home</a>
</div>

<iframe
  id="bgMusic"
  width="0"
  height="0"
  src="https://www.youtube.com/embed/W1tzURKYFNs?enablejsapi=1"
  frameborder="0"
  allow="autoplay">
</iframe>

<script src="https://www.youtube.com/iframe_api"></script>

<div class="type-tabs">
  <button id="tabAll" onclick="switchType('all')" class="active">All</button>
  <button id="tabArtist" onclick="switchType('artist')">Lingling & Brand</button>
  <button id="tabMedia" onclick="switchType('media')">Media & KOL</button>
</div>

<div class="controls">
  <select id="platformFilter" onchange="loadData()">
    <option value="all">All Platforms</option>
  </select>

  <select id="sortSelect" onchange="loadData()">
    <option value="eng_desc">Engagement: High → Low</option>
    <option value="eng_asc">Engagement: Low → High</option>
    <option value="reach_desc">Reach: High → Low</option>
    <option value="reach_asc">Reach: High → High</option>
  </select>
</div>

<!-- ================= LINGLING & BRAND TOTAL QUEST ================= -->
<div class="quest-container">
  <div class="quest-header">
    <div class="quest-title"><i class="fa-solid fa-flag-checkered" style="color:var(--accent);"></i> LINGLING & BRAND TOTAL QUEST</div>
    <div style="font-size: 12px; color: var(--text-muted);">Target Per Post</div>
  </div>
  <div class="quest-grid">
    <div class="quest-card">
      <div class="quest-label">Likes</div>
      <div class="quest-values">1,200,000</div>
    </div>
    <div class="quest-card">
      <div class="quest-label">Comments</div>
      <div class="quest-values">100,000</div>
    </div>
    <div class="quest-card">
      <div class="quest-label">Reposts</div>
      <div class="quest-values">60,000</div>
    </div>
    <div class="quest-card">
      <div class="quest-label">Shared</div>
      <div class="quest-values">1,000,000</div>
    </div>
    <div class="quest-card">
      <div class="quest-label">Views</div>
      <div class="quest-values">5,000,000</div>
    </div>
  </div>
</div>

<div id="globalSummary" class="summary"></div>

<!-- Container สำหรับแสดงผลแบบแบ่งโซน (บน: Lingling & Brand, ล่าง: MIV / Media แยกแพลตฟอร์ม) -->
<div id="splitContainer">
  <div class="section-container" id="artistSectionHeader">
    <div class="section-title">Lingling & Brand</div>
  </div>
  <div id="artistContent" class="grid"></div>

  <div class="section-container" id="mediaSectionHeader">
    <div class="section-title">MIV & Media</div>
  </div>
  <div id="mediaContent"></div>
</div>

<div class="progress-section">
  <div class="progress-label">
    <span>Posts Reviewed</span>
    <span id="reviewCount">0 / 0</span>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>
</div>

<!-- ================= กล่องลอยสุ่มแคปชันแบบพร้อมกดได้ทันที ================= -->
<div id="floatingCaptionWidget" class="floating-widget">
  <div class="widget-header">
    <div class="widget-title"><i class="fa-solid fa-wand-magic-sparkles" style="color:var(--accent);"></i> CK x NYFW Captions</div>
    <button class="widget-close" onclick="hideWidget()"><i class="fa-solid fa-xmark"></i></button>
  </div>

  <div class="widget-controls">
    <button class="widget-platform-btn active" onclick="setWidgetPlatform('IG', this)">IG</button>
    <button class="widget-platform-btn" onclick="setWidgetPlatform('X', this)">X</button>
  </div>

  <div class="widget-toggle">
    <span id="widgetToggleLabel">#️⃣ With Hashtag</span>
    <label class="switch">
      <input type="checkbox" id="widgetTagSwitch" checked onchange="toggleWidgetHashtags(this)">
      <span class="slider-toggle"></span>
    </label>
  </div>

  <div id="widgetCaptionDisplay" class="widget-caption-box">
    Loading....
  </div>

  <div class="widget-actions">
    <button class="widget-btn btn-random" onclick="generateWidgetCaption()"><i class="fa-solid fa-shuffle"></i> Random</button>
    <button class="widget-btn btn-copy" onclick="copyWidgetCaption()"><i class="fa-regular fa-copy"></i> Copy</button>
  </div>
</div>

<button id="floatingTriggerBtn" class="floating-trigger-btn" onclick="showWidget()">
  <i class="fa-solid fa-wand-magic-sparkles"></i> Open Captions Box
</button>

<div id="toast" class="toast">Copied to Clipboard!</div>

<script>

// กำหนดเป้าหมายต่อโพสต์ (Individual Post Targets) สำหรับเควสย่อยในแต่ละโพสต์
const POST_TARGETS = {
  likes: 1200000,
  comments: 100000,
  reposts: 60000,
  shares: 1000000,
  views: 5000000
};

let globalCaptionsData = [];
let globalHashtagData = [];
let widgetPlatform = "IG";
let widgetIncludeHashtags = true;

const n = t => (t || "").toLowerCase().replace(/\s|_/g, "");

function loadCaptionSourceData() {
  let rawData = null;
  if (typeof defaultData !== 'undefined') {
      rawData = defaultData;
  } else if (typeof data !== 'undefined') {
      rawData = data;
  } else if (typeof captionsData !== 'undefined') {
      rawData = captionsData;
  }

  if (rawData) {
      globalCaptionsData = rawData.captions || (Array.isArray(rawData) ? rawData : []);
      globalHashtagData = rawData.hashtags || [];
  }
}

function hideWidget() {
  document.getElementById('floatingCaptionWidget').style.display = 'none';
  document.getElementById('floatingTriggerBtn').style.display = 'flex';
}

function showWidget() {
  document.getElementById('floatingCaptionWidget').style.display = 'block';
  document.getElementById('floatingTriggerBtn').style.display = 'none';
  generateWidgetCaption();
}

function setWidgetPlatform(p, btn) {
  widgetPlatform = p;
  document.querySelectorAll(".widget-platform-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  generateWidgetCaption();
}

function toggleWidgetHashtags(checkbox) {
  widgetIncludeHashtags = checkbox.checked;
  const label = document.getElementById("widgetToggleLabel");
  if (widgetIncludeHashtags) {
    label.innerHTML = "#️⃣ With Hashtag";
  } else {
    label.innerHTML = "❌ No Hashtag";
  }
  generateWidgetCaption();
}

function generateWidgetCaption() {
  loadCaptionSourceData();
  const display = document.getElementById('widgetCaptionDisplay');
  
  const filtered = globalCaptionsData.filter(c => 
    n(c.brand) === n("CalvinKlein") && n(c.campaign) === n("NYFW")
  ).map(c => c.caption);

  if (!filtered || filtered.length === 0) {
    display.innerText = "No Fonud Captions for CalvinKlein Campaign NYFW in data";
    return;
  }

  const randomCap = filtered[Math.floor(Math.random() * filtered.length)];
  let finalResult = randomCap;

  if (widgetIncludeHashtags) {
    const tags = globalHashtagData.find(h => 
      n(h.brand) === n("CalvinKlein") && n(h.campaign) === n("NYFW") && n(h.platform) === n(widgetPlatform)
    );
    if (tags && tags.hashtags) {
      finalResult += "\n\n" + tags.hashtags;
    }
  }

  display.innerText = finalResult;
}

function copyWidgetCaption() {
  const text = document.getElementById('widgetCaptionDisplay').innerText;
  if (!text || text.includes("No Found")) return;
  
  navigator.clipboard.writeText(text).then(() => {
    const toast = document.getElementById("toast");
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2000);
  });
}

document.addEventListener("DOMContentLoaded", () => {
  loadCaptionSourceData();
  generateWidgetCaption();
});

let currentType="all";

function switchType(type){
  currentType=type;

  document.querySelectorAll(".type-tabs button")
    .forEach(btn=>btn.classList.remove("active"));

  if(type==="artist"){
    document.getElementById("tabArtist").classList.add("active");
    document.body.setAttribute("data-theme","artist");
  }
  else if(type==="media"){
    document.getElementById("tabMedia").classList.add("active");
    document.body.setAttribute("data-theme","media");
  }
  else{
    document.getElementById("tabAll").classList.add("active");
    document.body.removeAttribute("data-theme");
  }

  loadData();
}

let player;
let playerReady = false;

function onYouTubeIframeAPIReady() {
  player = new YT.Player('bgMusic', {
    events: {
      'onReady': function() {
        playerReady = true;
      }
    }
  });
}

function playMusic(){
  if(playerReady){
    player.playVideo();
  } else {
    console.log("Player not ready yet");
  }
}

const API_URL="https://script.google.com/macros/s/AKfycbwrnq7GGP6YB5greHUJWQOKoaK_juJeWvUKsq7R27cuNVXtnrPlRKRurlLVb2RQEVtD/exec";

function loadData(){
  const artistCont = document.getElementById("artistContent");
  const mediaCont = document.getElementById("mediaContent");
  
  if(artistCont.innerHTML === "" && mediaCont.innerHTML === "") {
    artistCont.innerHTML = `
      <div class="empty-state">
        <div class="spinner"></div>
        <h3>Loading Campaign Data...</h3>
        <p>Loading.....</p>
      </div>
    `;
  }

  fetch(API_URL)
  .then(res=>res.json())
  .then(data=>{
    populatePlatformFilter(data);
    render(data);
  })
  .catch(err => {
    artistCont.innerHTML = `
      <div class="empty-state">
        <h3>Awaiting Data Connection</h3>
        <p>No Found Data</p>
      </div>
    `;
    mediaCont.innerHTML = "";
  });
}

function populatePlatformFilter(data){
  const select=document.getElementById("platformFilter");
  const currentValue=select.value;
  select.innerHTML='<option value="all">All Platforms</option>';
  const platforms=[...new Set(data.map(p=>p.platform?.trim()))];
  platforms.forEach(p=>{
    if(!p)return;
    const option=document.createElement("option");
    option.value=p;
    option.textContent=p;
    select.appendChild(option);
  });
  select.value=currentValue||"all";
}

function render(data){

  const selectedPlatform=document.getElementById("platformFilter").value;
  const sort=document.getElementById("sortSelect").value;

  data.forEach(p=>{
    if(!p.sheetType){
      p.sheetType = "artist";
    }
  });

  if(selectedPlatform!=="all"){
    data=data.filter(p=>p.platform===selectedPlatform);
  }

  data.forEach(p=>{
    p.eng =
      Number(p.likes||0) +
      Number(p.comments||0) +
      Number(p.shares||0) +
      Number(p.reposts||0);
  });

  const sortFunc = (a, b) => {
    switch(sort){
      case "eng_desc": return b.eng - a.eng;
      case "eng_asc": return a.eng - b.eng;
      case "reach_desc": return Number(b.views||0) - Number(a.views||0);
      case "reach_asc": return Number(a.views||0) - Number(b.views||0);
      default: return 0;
    }
  };

  let artistData = data.filter(p => (p.sheetType || "").toString().trim().toLowerCase() === "artist");
  let mediaData = data.filter(p => (p.sheetType || "").toString().trim().toLowerCase() === "media");

  artistData.sort(sortFunc);
  mediaData.sort(sortFunc);

  renderSummary(data);
  
  const artistHeader = document.getElementById("artistSectionHeader");
  const mediaHeader = document.getElementById("mediaSectionHeader");
  const mediaCont = document.getElementById("mediaContent");

  if(currentType === "artist"){
    artistHeader.style.display = "block";
    mediaHeader.style.display = "none";
    renderCards(artistData, "artistContent", false);
    mediaCont.innerHTML = "";
  } else if(currentType === "media"){
    artistHeader.style.display = "none";
    mediaHeader.style.display = "block";
    document.getElementById("artistContent").innerHTML = "";
    renderGroupedMedia(mediaData, mediaCont);
  } else {
    artistHeader.style.display = "block";
    mediaHeader.style.display = "block";
    renderCards(artistData, "artistContent", false);
    renderGroupedMedia(mediaData, mediaCont);
  }

  updateProgress();
}

function renderSummary(dataset){

  let reach=0,eng=0,repostTotal=0;

  dataset.forEach(p=>{
    reach+=Number(p.views||0);
    eng+=p.eng||0;
    repostTotal+=Number(p.reposts||0);
  });

  document.getElementById("globalSummary").innerHTML=`
    <div class="summary-item">
      <h3>REACH</h3>
      <div class="number">${reach.toLocaleString()}</div>
    </div>

    <div class="summary-item">
      <h3>ENGAGEMENT</h3>
      <div class="number">${eng.toLocaleString()}</div>
    </div>

    <div class="summary-item">
      <h3>REPOSTS</h3>
      <div class="number">${repostTotal.toLocaleString()}</div>
    </div>

    <div class="summary-item">
      <h3>TOTAL POSTS</h3>
      <div class="number">${dataset.length}</div>
    </div>
  `;
}

function getPlatformIcon(platform){

  if(!platform) return "";

  const p = platform.toLowerCase();

  if(p.includes("tiktok")){
    return "https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/tiktok.svg";
  }
  if(p.includes("instagram") || p.includes("ig")){
    return "https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/instagram.svg";
  }
  if(p === "x" || p.includes("twitter")){
    return "https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/x.svg";
  }

  return "";
}

function getReviewedPosts(){
  return JSON.parse(localStorage.getItem("reviewedPosts") || "[]");
}

function saveReviewedPosts(list){
  localStorage.setItem("reviewedPosts", JSON.stringify(list));
}

function markAsReviewed(id){
  let reviewed = getReviewedPosts();
  if(!reviewed.includes(id)){
    reviewed.push(id);
    saveReviewedPosts(reviewed);
  }
}

function handleOpen(button, link, postId){

  window.open(link,'_blank');

  markAsReviewed(postId);

  button.classList.add("opened");

  updateProgress();
}

function updateProgress(){

  const reviewed = getReviewedPosts();
  const cards = document.querySelectorAll(".card");

  let visiblePostIds = [];

  cards.forEach(card=>{
    const btn = card.querySelector("button");
    if(btn){
      const onclickAttr = btn.getAttribute("onclick");
      const match = onclickAttr.match(/,'(.*?)'\)/);
      if(match && match[1]){
        visiblePostIds.push(match[1]);
      }
    }
  });

  const reviewedVisible = visiblePostIds.filter(id=>reviewed.includes(id));

  const count = reviewedVisible.length;
  const totalPosts = visiblePostIds.length;

  document.getElementById("reviewCount").innerText =
    count + " / " + totalPosts;

  const percent = totalPosts ? (count/totalPosts)*100 : 0;

  document.getElementById("progressFill").style.width = percent + "%";
}

function createPostQuestHTML(p) {
  const metrics = [
    { key: 'likes', label: 'Likes', val: Number(p.likes || 0) },
    { key: 'comments', label: 'Comments', val: Number(p.comments || 0) },
    { key: 'reposts', label: 'Reposts', val: Number(p.reposts || 0) },
    { key: 'shares', label: 'Shared', val: Number(p.shares || 0) },
    { key: 'views', label: 'Views', val: Number(p.views || 0) }
  ];

  let rowsHTML = "";
  metrics.forEach(m => {
    const target = POST_TARGETS[m.key];
    let pct = (m.val / target) * 100;
    if (pct > 100) pct = 100;

    rowsHTML += `
      <div class="pq-row">
        <span>${m.label}</span>
        <div class="pq-bar-bg">
          <div class="pq-bar-fill" style="width: ${pct}%"></div>
        </div>
        <span class="pq-val">${m.val.toLocaleString()}/${target.toLocaleString()}</span>
      </div>
    `;
  });

  return `
    <div class="post-quest-box">
      <div class="post-quest-title">
        <span>🎯 Post Target Mission</span>
        <span>${((metrics.reduce((acc, m) => acc + Math.min((m.val / POST_TARGETS[m.key]) * 100, 100), 0)) / 5).toFixed(0)}%</span>
      </div>
      ${rowsHTML}
    </div>
  `;
}

function renderCards(data, containerId, isCompact){

  const container=document.getElementById(containerId);
  container.innerHTML="";

  const reviewed = getReviewedPosts();

  if(!data || data.length===0){
    container.innerHTML=`
      <div class="empty-state">
        <h3>No Posts Found</h3>
        <p>No Post Found</p>
      </div>
    `;
    return;
  }

  data.forEach(p=>{

    const cardClass = isCompact ? "card compact-card" : "card";
    const postId = p.link;

    const imageHTML = !isCompact && p.thumbnail
      ? `<img class="post-img" src="${p.thumbnail || ''}">`
      : "";

    const iconURL = getPlatformIcon(p.platform);

    const titleHTML = `
      <div class="platform-title">
        ${iconURL ? `<img class="platform-icon" src="${iconURL}">` : ""}
        <span>${p.post_name||''}</span>
      </div>
    `;

    const postQuestHTML = !isCompact ? createPostQuestHTML(p) : "";
    const isOpened = reviewed.includes(postId);

    container.innerHTML+=`
      <div class="${cardClass}">
        <div>
          ${imageHTML}

          ${!isCompact ? `<div class="badge ${p.sheetType}">${p.sheetType==="artist"?"Lingling & Brand":"Media"}</div>` : ""}

          ${titleHTML}

          ${postQuestHTML}
        </div>

        <button 
          class="action-btn ${isOpened ? "opened" : ""}"
          onclick="handleOpen(this,'${p.link}','${postId}')">
          ${isOpened ? "Opened" : "Open Post"}
        </button>

      </div>
    `;
  });
}

// ฟังก์ชันจัดกลุ่ม MIV ตาม Platform ย่อย
function renderGroupedMedia(data, container) {
  container.innerHTML = "";

  const reviewed = getReviewedPosts();

  if (!data || data.length === 0) {
    container.innerHTML = `
      <div class="empty-state" style="width: 90%; margin: 0 auto;">
        <h3>No Posts Found</h3>
        <p>No Posts Found</p>
      </div>
    `;
    return;
  }

  // จัดกลุ่มโพสต์ตาม Platform
  const groups = {};
  data.forEach(p => {
    const plat = (p.platform || "Other").trim();
    if (!groups[plat]) {
      groups[plat] = [];
    }
    groups[plat].push(p);
  });

  // วนลูปสร้างหมวดหมู่ย่อยแต่ละ Platform
  for (const [platformName, posts] of Object.entries(groups)) {
    const iconURL = getPlatformIcon(platformName);

    const subContainer = document.createElement("div");
    subContainer.className = "platform-sub-container";

    let cardsHTML = "";
    posts.forEach(p => {
      const postId = p.link;
      const isOpened = reviewed.includes(postId);
      const cardTitleHTML = `
        <div class="platform-title">
          <span>${p.post_name||''}</span>
        </div>
      `;

      cardsHTML += `
        <div class="card compact-card">
          <div>
            ${cardTitleHTML}
          </div>

          <button 
            class="action-btn ${isOpened ? "opened" : ""}"
            onclick="handleOpen(this,'${p.link}','${postId}')">
            ${isOpened ? "Opened" : "Open Post"}
          </button>
        </div>
      `;
    });

    subContainer.innerHTML = `
      <div class="platform-sub-title">
        ${iconURL ? `<img class="platform-icon" src="${iconURL}">` : ""}
        <span>${platformName} (${posts.length})</span>
      </div>
      <div class="grid-compact">
        ${cardsHTML}
      </div>
    `;

    container.appendChild(subContainer);
  }
}

loadData();
setInterval(loadData, 60000);

</script>

</body>
</html>
