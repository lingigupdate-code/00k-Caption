<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>00K Engagement</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        /* ใช้ธีมและ CSS พื้นฐานแบบเดียวกับหน้า index.html เดิม */
        body {
            margin: 0; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background-color: #000;
            background-image: linear-gradient(rgba(0,0,0,.3), rgba(0,0,0,.3)), url("https://lingigupdate-code.github.io/00k-Caption/image/fashion.jpg");
            background-size: cover; background-position: center;
        }
        .container { width: 100%; max-width: 400px; padding: 15px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; }
        .card {
            background: rgba(255, 255, 255, 0.07); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 20px; padding: 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25); text-align: center;
        }
        h1 { font-family: 'Outfit', sans-serif; font-size: 18px; margin-bottom: 15px; }
        .back-btn {
            display: inline-block; background: rgba(255,255,255,0.12); color: #fff;
            text-decoration: none; padding: 10px 20px; border-radius: 12px; font-size: 12px; font-weight: 600; margin-top: 15px; transition: 0.3s;
        }
        .back-btn:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>00K ENGAGEMENT</h1>
            <p style="font-size: 13px; color: rgba(255,255,255,0.7);">พื้นที่สำหรับรวบรวมข้อมูลหรือเครื่องมือ Engagement เร็วๆ นี้</p>
            <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> กลับหน้าหลัก Captions</a>
        </div>
    </div>
</body>
</html>
