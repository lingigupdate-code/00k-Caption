<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ 00k Captions for DiorAW26 ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Prompt', sans-serif;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.card {
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(25px);
  border-radius: 20px;
  padding: 40px;
  width: 95%;
  max-width: 600px;
  text-align: center;
  color: white;
  box-shadow: 0 25px 60px rgba(0,0,0,0.5);
}

.platform-buttons button {
  margin: 6px;
  padding: 10px 18px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  font-weight: 500;
  transition: 0.3s;
}

.btn-ig { background: linear-gradient(45deg,#f09433,#e6683c,#dc2743); color:white; }
.btn-x { background: black; color:white; }

.platform-buttons button.active {
  transform: scale(1.05);
  box-shadow: 0 10px 20px rgba(0,0,0,0.4);
}

.main-btn {
  margin: 10px;
  padding: 12px 22px;
  border-radius: 14px;
  border: none;
  cursor: pointer;
  font-size: 15px;
  font-weight: 500;
}

.random-btn { background:#00f2fe; color:#000; }
.copy-btn { background:#ffffff; color:#333; }

.result {
  margin-top: 25px;
  font-size: 20px;
  min-height: 80px;
  white-space: pre-line;
}

.counter {
  margin-top: 8px;
  font-size: 14px;
  opacity: 0.8;
}

.btn-fb { background:#1877F2; color:white; }
.btn-tt { background:#000; color:white; }
.btn-th { background:#101010; color:white; }

</style>
</head>

<body>

<div class="card">
  <h1>✨00k Captions for DiorAW26✨</h1>

  <div class="platform-buttons">
  <button class="btn-ig active" onclick="setPlatform('IG_FEED', this)">IG Feed</button>
  <button class="btn-ig" onclick="setPlatform('IG_STORY', this)">IG Story</button>
  <button class="btn-x" onclick="setPlatform('X', this)">X</button>
  <button class="btn-fb" onclick="setPlatform('FB', this)">Facebook</button>
  <button class="btn-tt" onclick="setPlatform('TikTok', this)">TikTok</button>
  <button class="btn-th" onclick="setPlatform('Threads', this)">Threads</button>
</div>

  <button class="main-btn random-btn" onclick="randomCaption()">สุ่มแคปชั่น</button>
  <button class="main-btn copy-btn" onclick="copyCaption()">คัดลอก</button>

  <label style="display:block;margin-top:10px;font-size:14px;">
    <input type="checkbox" id="toggleHashtag" checked onchange="updateDisplay()">
    แสดง Hashtag
  </label>

  <div class="result" id="result">กำลังโหลด...</div>
  <div class="counter" id="counter"></div>
</div>

<script>
let allCaptions = [];
let allHashtags = [];
let currentPlatform = "IG_FEED";
let shuffled = [];
let currentCaption = "";

const X_LIMIT = 280;

/* ===== LOAD DATA ===== */

fetch("captions.csv")
  .then(res => res.text())
  .then(text => {
      parseCSV(text);
      filterPlatform();
  });

fetch("hashtags.csv")
  .then(res => res.text())
  .then(text => parseHashtagCSV(text));

function parseCSV(text) {
    const lines = text.split('\n').filter(l => l.trim() !== '');
    const header = lines[0].split(',');
    const pIndex = header.indexOf("platform");
    const cIndex = header.indexOf("caption");

    for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split(',');
        allCaptions.push({
            platform: cols[pIndex],
            caption: cols[cIndex]
        });
    }
}

function parseHashtagCSV(text) {

    const lines = text.split('\n').filter(l => l.trim() !== '');
    const header = lines[0].split(',');

    const pIndex = header.indexOf("platform");
    const tIndex = header.indexOf("type");
    const hIndex = header.indexOf("hashtags");

    for (let i = 1; i < lines.length; i++) {

        // แก้ปัญหา comma ใน hashtag
        const cols = lines[i].split(',');

        const platform = cols[pIndex];
        const type = cols[tIndex];

        // รวม column ที่เหลือทั้งหมดเป็น hashtag เดียว
        const hashtags = cols.slice(hIndex).join(',').trim();

        allHashtags.push({
            platform: platform,
            type: type,
            hashtags: hashtags
        });
    }
}
/* ===== PLATFORM ===== */

function setPlatform(platform, btn) {

    currentPlatform = platform;

    document.querySelectorAll(".platform-buttons button")
        .forEach(b => b.classList.remove("active"));

    btn.classList.add("active");

    filterPlatform();
    updateDisplay();
}

function filterPlatform() {

    let source = "IG";
    if(currentPlatform === "X") source = "X";

    const filtered = allCaptions
        .filter(c => c.platform === source)
        .map(c => c.caption);

    shuffled = [...filtered];
    shuffle();

    document.getElementById("result").innerText = "พร้อมสุ่มแล้ว 🎉";
    document.getElementById("counter").innerText =
        "ทั้งหมด " + shuffled.length + " แคปชั่น";
}

function shuffle() {
    for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
}

/* ===== RANDOM ===== */

function randomCaption() {
    if (shuffled.length === 0) filterPlatform();
    currentCaption = shuffled.pop();
    updateDisplay();
}

/* ===== DISPLAY ===== */

function updateDisplay(){

    if(!currentCaption) return;

    const showHashtag = document.getElementById("toggleHashtag").checked;

    let finalText = currentCaption;
    let hashtag = getAutoHashtag();

    if(showHashtag && hashtag){
        finalText = currentCaption + "\n\n" + hashtag;
    }

    if(currentPlatform === "X" && finalText.length > X_LIMIT){

        if(showHashtag && hashtag){
            const allowed = X_LIMIT - hashtag.length - 2;
            finalText =
                currentCaption.substring(0, allowed - 3)
                + "..."
                + "\n\n"
                + hashtag;
        } else {
            finalText =
                currentCaption.substring(0, X_LIMIT - 3) + "...";
        }
    }

    document.getElementById("result").innerText = finalText;
}

/* ===== HASHTAG AUTO ===== */

function getAutoHashtag(){

    let platform = "IG";
    let type = "feed";

    if(currentPlatform === "IG_STORY"){
        type = "story";
    }

    if(currentPlatform === "X"){
        platform = "X";
        type = "post";
    }

    if(currentPlatform === "FB"){
        platform = "FB";
        type = "post";
    }

    if(currentPlatform === "TikTok"){
        platform = "TikTok";
        type = "post";
    }

    if(currentPlatform === "Threads"){
        platform = "Threads";
        type = "post";
    }

    const found = allHashtags.find(
        h => h.platform === platform && h.type === type
    );

    return found ? found.hashtags : "";
}
/* ===== COPY ===== */

function copyCaption() {
    const text = document.getElementById("result").innerText;
    if (!text) return;
    navigator.clipboard.writeText(text);
}
</script>

</body>
</html>
