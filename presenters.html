<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>00K Business Cards | Lingling Kwong</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
<style>
:root {
    --primary-bg: #0a0a0a;
    --gold-accent: #c5a059;
    --text-ivory: #f4f1ea;
    --text-muted: #888;
    --card-bg: rgba(255, 255, 255, 0.03);
    --card-border: rgba(255, 255, 255, 0.1);
    --transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
}

body {
    background-color: var(--primary-bg);
    color: var(--text-ivory);
    font-family: 'Inter', sans-serif;
    margin: 0;
    padding: 40px 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    box-sizing: border-box;
}

/* --- แก้ไข: สร้าง Layer พื้นหลังฟิกซ์อยู่กับที่แบบ 100% ทุกอุปกรณ์ --- */
.fixed-background {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: 
        linear-gradient(rgba(10, 10, 10, 0.85), rgba(10, 10, 10, 0.85)), 
        url("https://lingigupdate-code.github.io/00k-Caption/image/presenter.jpg"); 
    background-size: contain;      
    background-position: center; 
    background-repeat: no-repeat;
    z-index: -1; /* ผลักไปอยู่หลังสุด */
    pointer-events: none; /* ป้องกันไม่ให้บังการกดปุ่ม */
}

/* นำสไตล์แบล็คกราวด์เดิมออกจากตัวเนื้อหาหลัก */
.header-section, .category-section, .back-btn, .spinner-container {
    position: relative;
    z-index: 1;
}

.header-section { text-align: center; margin-bottom: 50px; width: 100%; }
.subtitle { color: var(--gold-accent); text-transform: uppercase; letter-spacing: 4px; font-size: 10px; margin-bottom: 8px; }
h1 { font-family: 'Bodoni Moda', serif; font-size: clamp(28px, 7vw, 50px); font-weight: 300; margin: 0; }

.category-section {
    width: 100%;
    max-width: 1000px;
    margin-bottom: 40px;
    display: none; 
}
.category-section.has-data { display: block; animation: fadeIn 0.8s forwards; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.category-title {
    font-family: 'Bodoni Moda', serif;
    font-size: clamp(18px, 5vw, 22px);
    border-bottom: 1px solid var(--card-border);
    padding-bottom: 8px;
    margin-bottom: 25px;
    color: var(--gold-accent);
}

/* --- Grid 3 Columns --- */
.presenter-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr); 
    gap: 20px; 
    width: 100%;
    align-items: stretch; 
}

/* --- Circular Logo Card --- */
.brand-card {
    text-decoration: none;
    background: rgba(255, 255, 255, 0.02); 
    border: 1px solid rgba(197, 160, 89, 0.15); 
    padding: 15px 5px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start; 
    transition: var(--transition);
    border-radius: 12px;
    height: 100%; 
    box-sizing: border-box;
}

.brand-card:hover {
    background: rgba(255, 255, 255, 0.07);
    border-color: var(--gold-accent);
    transform: translateY(-5px);
}

/* --- ปรับปรุงกรอบรูปภาพ --- */
.brand-logo-container {
    width: 65px;  
    height: 65px;
    aspect-ratio: 1/1;
    border-radius: 50%; 
    border: 1px solid rgba(197, 160, 89, 0.3);
    background: white; 
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0; 
}

.brand-card:hover .brand-logo-container {
    border-color: var(--gold-accent);
    background: rgba(197, 160, 89, 0.1);
    box-shadow: 0 0 15px rgba(197, 160, 89, 0.3);
}

.brand-logo {
    width: 85%; 
    height: 85%;
    object-fit: contain;
}

.brand-card:hover .brand-logo {
    transform: scale(1.2); 
}

.brand-name {
    color: var(--text-muted);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    text-align: center;
    margin-top: auto; 
}

.back-btn {
    background: transparent;
    border: 1px solid var(--gold-accent);
    color: var(--gold-accent);
    padding: 12px 30px;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-size: 10px;
    cursor: pointer;
    margin-top: 40px;
    border-radius: 50px;
}

/* --- สไตล์ของ Spinner (สัญลักษณ์หมุน) --- */
.spinner-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin-top: 50px;
}

.spinner {
    width: 40px;
    height: 40px;
    border: 3px solid rgba(197, 160, 89, 0.1); 
    border-radius: 50%;
    border-top-color: var(--gold-accent); 
    animation: spin 1s ease-in-out infinite;
    margin-bottom: 15px;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.loading-text {
    color: var(--gold-accent);
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
}

.loading { color: var(--gold-accent); letter-spacing: 2px; margin-top: 40px; font-size: 12px; }

/* --- Mobile Responsive ปรับขนาดให้พอดีหน้าจอ --- */
@media (max-width: 768px) {
    body { 
        padding: 30px 10px;
    }
    /* แก้ไขส่วนเบราว์เซอร์มือถือให้พื้นหลังคลุมสวยงามและนิ่งสนิท */
    .fixed-background {
        background-size: cover;
    }
    .presenter-grid { 
        grid-template-columns: repeat(3, 1fr); 
        gap: 10px; 
    }
    .brand-logo-container {
        width: 70px; 
        height: 70px;
        padding: 5px; 
    }
}

/* --- สไตล์พิเศษสำหรับ Expired Contact (ขาวดำ) --- */
#section-expired-contact {
    margin-top: 100px; 
    border-top: 1px dashed var(--card-border);
    padding-top: 40px;
}

#section-expired-contact .category-title {
    color: #666; 
    text-align: center;
    border-bottom: none;
}

#section-expired-contact .brand-card {
    filter: grayscale(100%);
    opacity: 0.5;
    border-color: rgba(255, 255, 255, 0.1);
}

#section-expired-contact .brand-card:hover {
    filter: grayscale(0%);
    opacity: 1;
    border-color: var(--gold-accent);
}

#section-expired-contact .brand-logo-container {
    background: rgba(255, 255, 255, 0.03); 
    border-color: rgba(255,255,255,0.1);
}

.brand-logo-container {
    width: 80px; height: 80px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.05); 
    border: 1px solid rgba(197, 160, 89, 0.3);
    padding: 0; 
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
}

.brand-logo {
    width: 100%; height: 100%;
    object-fit: contain; 
    transform: scale(1.1); 
}

@media (max-width: 430px) {
    .presenter-grid { 
        grid-template-columns: repeat(3, 1fr); 
        gap: 8px; 
    }
    .brand-logo-container {
        width: 60px; 
        height: 60px;
        padding: 0px; 
    }
    .brand-card { 
        padding: 12px 4px; 
        border-radius: 8px;
    }
    .brand-name { 
        font-size: 8.5px; 
        letter-spacing: 0px; 
        line-height: 1.1;
    }
}
</style>
</head>
<body>

    <div class="fixed-background"></div>

    <div class="header-section">
        <div class="subtitle">Official Brand Portfolio</div>
        <h1>Lingling Kwong</h1>
    </div>

    <div id="loading" class="spinner-container">
    <div class="spinner"></div>
    <div class="loading-text">Fetching Portfolio</div>
    </div>

    <div id="section-brand-owner" class="category-section">
        <div class="category-title">Brand Owner</div>
        <div id="grid-brand-owner" class="presenter-grid"></div>
    </div>

    <div id="section-global-brand-ambassador" class="category-section">
        <div class="category-title">Global Brand Ambassador</div>
        <div id="grid-global-brand-ambassador" class="presenter-grid"></div>
    </div>

    <div id="section-brand-ambassador" class="category-section">
        <div class="category-title">Brand Ambassador</div>
        <div id="grid-brand-ambassador" class="presenter-grid"></div>
    </div>

    <div id="section-face-of-apac" class="category-section">
        <div class="category-title">Face Of APAC</div>
        <div id="grid-face-of-apac" class="presenter-grid"></div>
    </div>

    <div id="section-brand-spokesperson" class="category-section">
        <div class="category-title">Brand Spokesperson</div>
        <div id="grid-brand-spokesperson" class="presenter-grid"></div>
    </div>

    <div id="section-friend-of-brand" class="category-section">
        <div class="category-title">Friend Of Brand</div>
        <div id="grid-friend-of-brand" class="presenter-grid"></div>
    </div>

    <div id="section-presenter" class="category-section">
        <div class="category-title">Presenter</div>
        <div id="grid-presenter" class="presenter-grid"></div>
    </div>

    <div id="section-expired-contact" class="category-section">
        <div class="category-title">Past Collaborations / Expired</div>
        <div id="grid-expired-contact" class="presenter-grid"></div>
    </div>

    <button class="back-btn" onclick="window.location.href='index.html'">Return to Home</button>

    <script>
        const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbwKIehMRb1q7s5d8pLTtXEtaEdVP-_BwFh6mxIjG77rFl0mT308uxVkAS6B9VFG_uk/exec";

        async function fetchPresenters() {
            try {
                const response = await fetch(SHEET_API_URL);
                const data = await response.json();
                const presenters = data.presenters || [];
                document.getElementById('loading').style.display = 'none';

                presenters.forEach(item => {
                    const targetLink = item.URL || "javascript:void(0)";
                    const cardHTML = `
                        <a href="${targetLink}" target="_blank" class="brand-card">
                            <div class="brand-logo-container">
                                <img src="${item.Image_URL}" class="brand-logo" alt="${item.Brand}">
                            </div>
                            <div class="brand-name">${item.Brand}</div>
                        </a>
                    `;

                    const rawType = item.Type ? item.Type.toString().trim() : "";
                    const typeId = rawType
                        .toLowerCase()
                        .replace(/&/g, 'and')
                        .replace(/\s+/g, '-')
                        .replace(/[^\w-]/g, '');

                    const grid = document.getElementById(`grid-${typeId}`);
                    const section = document.getElementById(`section-${typeId}`);

                    if (grid && section) {
                        grid.innerHTML += cardHTML;
                        section.classList.add('has-data');
                    }
                });
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('loading').innerText = "Unable to load data.";
            }
        }
        window.onload = fetchPresenters;
    </script>
</body>
</html>
