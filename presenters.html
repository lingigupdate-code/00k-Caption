<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>00K Business Cards | Lingling Kwong</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --accent: #F9B2D7;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 15px;
            min-height: 100vh;
            letter-spacing: 0.01em;
        }

        .header-section { text-align: center; margin-bottom: 50px; }
        h1 { 
            font-family: 'Bodoni Moda', serif; 
            font-size: 28px; 
            font-weight: 400;
            letter-spacing: 3px; 
            margin: 8px 0;
            text-transform: uppercase;
        }
        .subtitle { 
            color: var(--accent); 
            font-size: 11px; 
            text-transform: uppercase; 
            letter-spacing: 3px;
        }

        .category-section {
            width: 100%;
            max-width: 600px; /* ขยายความกว้างรวมเล็กน้อยเพื่อให้ 3 คอลัมน์ดูไม่เบียด */
            margin-bottom: 40px;
            display: none; 
        }
        .category-section.has-data { display: block; }

        .category-title {
            font-family: 'Bodoni Moda', serif;
            font-size: 15px;
            font-style: italic;
            color: var(--text-dim);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .category-title::after {
            content: ""; flex: 1; height: 1px;
            background: linear-gradient(90deg, var(--border), transparent);
        }

        /* ปรับเป็น 3 คอลัมน์ตรงนี้ */
        .presenter-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            gap: 12px;
        }

        .brand-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 15px 10px; /* ลด padding เพื่อให้เหมาะกับขนาด 3 ช่อง */
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: inherit;
            transition: all 0.4s ease;
        }

        .brand-card:hover {
            background: #222;
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .brand-logo {
            width: 55px; /* ลดขนาดโลโก้ลงให้พอดีกับช่องที่เล็กลง */
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
            border: 1px solid var(--border);
            padding: 3px;
            background: var(--bg-color);
        }

        .brand-name {
            font-weight: 400;
            font-size: 12px; /* ลดขนาดฟอนต์ชื่อแบรนด์ลงเล็กน้อย */
            text-align: center;
            color: var(--text-main);
            line-height: 1.2;
        }

        .loading { font-style: italic; color: var(--text-dim); font-size: 13px; }

        .back-btn {
            margin-top: 30px;
            padding: 10px 25px;
            border-radius: 2px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
        }
        .back-btn:hover { color: var(--text-main); border-color: var(--text-main); }

        /* สำหรับมือถือจอเล็กมาก ให้ปรับกลับเป็น 2 ช่องเพื่อไม่ให้เล็กเกินไป */
        @media (max-width: 450px) {
            .presenter-grid { grid-template-columns: repeat(2, 1fr); }
            .category-section { max-width: 100%; }
        }
    </style>
</head>
<body>

    <div class="header-section">
        <div class="subtitle">Official Brand Portfolio</div>
        <h1>Lingling Kwong</h1>
    </div>

    <div id="loading" class="loading">Fetching collection...</div>

    <div id="section-brand-owner" class="category-section">
        <div class="category-title">Brand Owner</div>
        <div id="grid-brand-owner" class="presenter-grid"></div>
    </div>

    <div id="section-brand-ambassador" class="category-section">
        <div class="category-title">Brand Ambassador</div>
        <div id="grid-brand-ambassador" class="presenter-grid"></div>
    </div>

    <div id="section-face-of-apac" class="category-section">
        <div class="category-title">Face Of APAC</div>
        <div id="grid-face-of-apac" class="presenter-grid"></div>
    </div>

    <div id="section-friend-of-brand" class="category-section">
        <div class="category-title">Friend Of Brand</div>
        <div id="grid-friend-of-brand" class="presenter-grid"></div>
    </div>

    <div id="section-presenter" class="category-section">
        <div class="category-title">Presenter</div>
        <div id="grid-presenter" class="presenter-grid"></div>
    </div>

    <button class="back-btn" onclick="window.location.href='index.html'">
        Return to Home
    </button>

    <script>
        const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbwKIehMRb1q7s5d8pLTtXEtaEdVP-_BwFh6mxIjG77rFl0mT308uxVkAS6B9VFG_uk/exec";

        async function fetchPresenters() {
            try {
                const response = await fetch(SHEET_API_URL);
                const data = await response.json();
                const presenters = data.presenters || [];

                document.getElementById('loading').style.display = 'none';

                presenters.forEach(item => {
                    const targetLink = item.URL ? item.URL : "javascript:void(0)";
                    const cardHTML = `
                        <a href="${targetLink}" target="_blank" class="brand-card">
                            <img src="${item.Image_URL}" class="brand-logo" alt="${item.Brand}">
                            <div class="brand-name">${item.Brand}</div>
                        </a>
                    `;

                    const typeId = item.Type.toLowerCase().trim().replace(/\s+/g, '-');
                    const grid = document.getElementById(`grid-${typeId}`);
                    const section = document.getElementById(`section-${typeId}`);

                    if (grid && section) {
                        grid.innerHTML += cardHTML;
                        section.classList.add('has-data');
                    }
                });
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('loading').innerText = "Unable to load data.";
            }
        }

        window.onload = fetchPresenters;
    </script>
</body>
</html>
