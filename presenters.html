<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>00K Business Cards | Lingling Kwong</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
<style>
:root {
    --primary-bg: #0a0a0a;
    --gold-accent: #c5a059;
    --text-ivory: #f4f1ea;
    --text-muted: #888;
    --card-bg: rgba(255, 255, 255, 0.03);
    --card-border: rgba(255, 255, 255, 0.1);
    --transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
}

body {
    background-color: var(--primary-bg);
    color: var(--text-ivory);
    font-family: 'Inter', sans-serif;
    margin: 0;
    padding: 40px 15px;
    display: flex;
    flex-direction: column;
    align-items: center;

    /* --- ส่วนที่แก้ไข: ใส่รูปแบล็คกราวด์ --- */
    background: 
        linear-gradient(rgba(10, 10, 10, 0.85), rgba(10, 10, 10, 0.85)), /* สีดำจางๆ ทับรูป */
        url("https://lingigupdate-code.github.io/00k-Caption/image/presenter.jpg"); 
    
    background-size: contain;      /* ให้รูปขยายเต็มหน้าจอ */
    background-position: center; /* จัดรูปให้อยู่ตรงกลาง */
    background-attachment: fixed; /* ให้รูปอยู่กับที่เวลาเลื่อนจอ (ดูพรีเมียมขึ้น) */
    background-repeat: no-repeat;
}

.header-section { text-align: center; margin-bottom: 50px; width: 100%; }
.subtitle { color: var(--gold-accent); text-transform: uppercase; letter-spacing: 4px; font-size: 10px; margin-bottom: 8px; }
h1 { font-family: 'Bodoni Moda', serif; font-size: clamp(28px, 7vw, 50px); font-weight: 300; margin: 0; }

.category-section {
    width: 100%;
    max-width: 1000px;
    margin-bottom: 40px;
    display: none; 
}
.category-section.has-data { display: block; animation: fadeIn 0.8s forwards; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.category-title {
    font-family: 'Bodoni Moda', serif;
    font-size: clamp(18px, 5vw, 22px);
    border-bottom: 1px solid var(--card-border);
    padding-bottom: 8px;
    margin-bottom: 25px;
    color: var(--gold-accent);
}

/* --- Grid 3 Columns --- */
.presenter-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr); 
    gap: 15px; /* ลดช่องว่างระหว่างการ์ด */
}

/* --- Circular Logo Card --- */
.brand-card {
    text-decoration: none;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    padding: 20px 10px; /* ปรับ Padding ภายในการ์ด */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
    border-radius: 12px;
    height: 100%; /* ให้ทุกการ์ดสูงเท่ากัน */
}

.brand-card:hover {
    background: rgba(255, 255, 255, 0.07);
    border-color: var(--gold-accent);
    transform: translateY(-5px);
}

/* --- ปรับปรุงกรอบรูปภาพ --- */
.brand-logo-container {
    width: 80px;  
    height: 80px;
    aspect-ratio: 1/1;
    border-radius: 50%; 
    /* เปลี่ยนจากเส้นขอบธรรมดา เป็นสีทองหม่น */
    border: 1px solid rgba(197, 160, 89, 0.4); 
    /* ลบพื้นหลังสีขาวออก ใช้สีเดียวกับการ์ด หรือใส่สีทองจางๆ */
    background: rgba(255, 255, 255, 0.05); 
    padding: 0; /* ลบ padding เพื่อให้รูปขยายได้เต็มที่ที่สุด */
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
    overflow: hidden;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.5); /* เพิ่มมิติความลึก */
}

.brand-card:hover .brand-logo-container {
    border-color: var(--gold-accent);
    background: rgba(197, 160, 89, 0.1);
    box-shadow: 0 0 15px rgba(197, 160, 89, 0.3);
}

.brand-logo {
    width: 100%;
    height: 100%;
    /* ใช้ object-fit: contain แต่ถ้าอยากให้เต็มวงจริงๆ ต้องใช้ cover 
       แต่แนะนำ contain เพื่อไม่ให้โลโก้แบรนด์โดนตัดครับ */
    object-fit: contain; 
    /* ขยายขนาดรูปเพิ่มอีกเล็กน้อยด้วย transform */
    transform: scale(1.1); 
    transition: var(--transition);
}

.brand-card:hover .brand-logo {
    transform: scale(1.2); /* เวลา hover โลโก้จะขยายใหญ่ขึ้นดูมีลูกเล่น */
}

.brand-name {
    color: var(--text-muted);
    font-size: clamp(10px, 3vw, 12px); /* ปรับขนาดฟอนต์ตามหน้าจอ */
    text-transform: uppercase;
    letter-spacing: 1px;
    text-align: center;
    font-weight: 500;
}

.back-btn {
    background: transparent;
    border: 1px solid var(--gold-accent);
    color: var(--gold-accent);
    padding: 12px 30px;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-size: 10px;
    cursor: pointer;
    margin-top: 40px;
    border-radius: 50px;
}

.loading { color: var(--gold-accent); letter-spacing: 2px; margin-top: 40px; font-size: 12px; }

/* --- Mobile Responsive ปรับขนาดให้พอดีหน้าจอ --- */
@media (max-width: 768px) {
    body { 
        padding: 30px 10px;
        /* บังคับพื้นหลังให้เต็มและคงที่บน Tablet */
        background-size: cover;
        background-attachment: fixed;
    }
    .presenter-grid { 
        grid-template-columns: repeat(3, 1fr); 
        gap: 10px; 
    }
    .brand-logo-container {
        width: 70px; /* ขยายขึ้นเล็กน้อยให้ดูเต็มตา */
        height: 70px;
        padding: 5px; /* ลด Padding ให้รูปโลโก้ใหญ่ขึ้น */
    }
}

@media (max-width: 430px) {
    body {
        padding: 20px 8px;
        /* แก้ไขคำสั่งพื้นหลังสำหรับมือถือให้ถูกต้อง */
        background-size: contain !important;
        background-position: center center;
        background-repeat: no-repeat;
        /* หมายเหตุ: บนมือถือบางรุ่น fixed อาจไม่ทำงาน ให้ใช้ scroll แทนเพื่อความลื่นไหล */
        background-attachment: scroll; 
    }
    .presenter-grid { 
        grid-template-columns: repeat(3, 1fr); 
        gap: 8px; 
    }
    .brand-logo-container {
        width: 60px; /* ปรับขนาดให้พอดีกับ 3 คอลัมน์บนมือถือ */
        height: 60px;
        padding: 0px; /* ดันรูปโลโก้ให้ชิดขอบวงกลมที่สุด */
    }
    .brand-card { 
        padding: 12px 4px; 
        border-radius: 8px;
    }
    .brand-name { 
        font-size: 8.5px; 
        letter-spacing: 0px; 
        line-height: 1.1;
    }
}
</style>
</head>
<body>

    <div class="header-section">
        <div class="subtitle">Official Brand Portfolio</div>
        <h1>Lingling Kwong</h1>
    </div>

    <div id="loading" class="loading">Loading Portfolio...</div>

    <div id="section-brand-owner" class="category-section">
        <div class="category-title">Brand Owner</div>
        <div id="grid-brand-owner" class="presenter-grid"></div>
    </div>

    <div id="section-global-brand-ambassador" class="category-section">
        <div class="category-title">Global Brand Ambassador</div>
        <div id="grid-global-brand-ambassador" class="presenter-grid"></div>
    </div>

    <div id="section-brand-ambassador" class="category-section">
        <div class="category-title">Brand Ambassador</div>
        <div id="grid-brand-ambassador" class="presenter-grid"></div>
    </div>

    <div id="section-face-of-apac" class="category-section">
        <div class="category-title">Face Of APAC</div>
        <div id="grid-face-of-apac" class="presenter-grid"></div>
    </div>

    <div id="section-friend-of-brand" class="category-section">
        <div class="category-title">Friend Of Brand</div>
        <div id="grid-friend-of-brand" class="presenter-grid"></div>
    </div>

    <div id="section-presenter" class="category-section">
        <div class="category-title">Presenter</div>
        <div id="grid-presenter" class="presenter-grid"></div>
    </div>

    <button class="back-btn" onclick="window.location.href='index.html'">Return to Home</button>

    <script>
        const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbwKIehMRb1q7s5d8pLTtXEtaEdVP-_BwFh6mxIjG77rFl0mT308uxVkAS6B9VFG_uk/exec";

        async function fetchPresenters() {
            try {
                const response = await fetch(SHEET_API_URL);
                const data = await response.json();
                const presenters = data.presenters || [];
                document.getElementById('loading').style.display = 'none';

                presenters.forEach(item => {
                    const targetLink = item.URL || "javascript:void(0)";
                    const cardHTML = `
                        <a href="${targetLink}" target="_blank" class="brand-card">
                            <div class="brand-logo-container">
                                <img src="${item.Image_URL}" class="brand-logo" alt="${item.Brand}">
                            </div>
                            <div class="brand-name">${item.Brand}</div>
                        </a>
                    `;

                    const rawType = item.Type ? item.Type.toString().trim() : "";
                    const typeId = rawType
                        .toLowerCase()
                        .replace(/&/g, 'and')
                        .replace(/\s+/g, '-')
                        .replace(/[^\w-]/g, '');

                    const grid = document.getElementById(`grid-${typeId}`);
                    const section = document.getElementById(`section-${typeId}`);

                    if (grid && section) {
                        grid.innerHTML += cardHTML;
                        section.classList.add('has-data');
                    }
                });
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('loading').innerText = "Unable to load data.";
            }
        }
        window.onload = fetchPresenters;
    </script>
</body>
</html>
