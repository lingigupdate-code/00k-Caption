<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>00K Captions</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F9B2D7">
<link rel="apple-touch-icon" href="icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root{
  --accent:#F9B2D7;
  --accent2:#CFECF3;
}

body[data-theme="dior"]{ --accent:#F9B2D7; --accent2:#CFECF3; }
body[data-theme="beauty"]{ --accent:#CFECF3; --accent2:#DAF9DE; }
body[data-theme="eyewear"]{ --accent:#DAF9DE; --accent2:#F6FFDC; }
body[data-theme="cartier"]{ --accent:#F6FFDC; --accent2:#F9B2D7; }

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:'Plus Jakarta Sans',sans-serif;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  height:100vh;
  overflow:hidden;
  padding-top:20px;
}

#cursorGlow{
  position:fixed;
  width:220px;
  height:220px;
  border-radius:50%;
  pointer-events:none;
  transform:translate(-50%,-50%);
}

.card{ max-width:500px; width:100%; padding:20px; }

h1{
  font-family:'Outfit',sans-serif;
  font-weight:600;
  background:linear-gradient(90deg,#fff,var(--accent));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

button{
  margin:5px;
  padding:10px 14px;
  border-radius:20px;
  border:1px solid rgba(255,255,255,0.3);
  background:transparent;
  color:#fff;
  cursor:pointer;
}

button.active,
button:hover{
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:#000;
}

.main-btn{
  border:none;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:#000;
}

.campaign-slider{
  display:flex;
  overflow-x:auto;
  gap:12px;
  padding:20px 10px;
  scroll-snap-type:x mandatory;
}
.campaign-slider::-webkit-scrollbar{display:none;}

.campaign-item{
  flex:0 0 70%;
  scroll-snap-align:center;
  padding:16px;
  border-radius:20px;
  background:rgba(255,255,255,0.05);
  transform:scale(0.85);
  opacity:0.4;
  transition:.4s;
}

.campaign-item.active{
  transform:scale(1);
  opacity:1;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:#000;
}

.result{
  margin-top:20px;
  min-height:110px;
  opacity:0;
  white-space:pre-line;
}

.result.show{opacity:1;}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#fff;
  color:#000;
  padding:10px 20px;
  border-radius:20px;
  opacity:0;
}
.toast.show{opacity:1;}
</style>
</head>

<body data-theme="dior">

<div id="cursorGlow"></div>

<div class="card">

<h1>00K CAPTIONS</h1>

<div class="campaign-slider" id="slider">
  <div class="campaign-item active" data-c="Dior">Dior</div>
  <div class="campaign-item" data-c="Dior Beauty">Beauty</div>
  <div class="campaign-item" data-c="Dior Eye Wear">Eyewear</div>
  <div class="campaign-item" data-c="Cartier">Cartier</div>
</div>

<!-- 🔥 UPDATED PLATFORM -->
<div>
  <button class="platform-btn active" onclick="setPlatform('IG',this)">IG</button>
  <button class="platform-btn" onclick="setPlatform('IG Story',this)">IG Story</button>
  <button class="platform-btn" onclick="setPlatform('X',this)">X</button>
  <button class="platform-btn" onclick="setPlatform('FB',this)">FB</button>
  <button class="platform-btn" onclick="setPlatform('TikTok',this)">TikTok</button>
  <button class="platform-btn" onclick="setPlatform('Threads',this)">Threads</button>
</div>

<button class="main-btn" onclick="spin()">RANDOM</button>
<button class="main-btn" onclick="copy()">COPY</button>

<div id="result" class="result"></div>

</div>

<div id="toast" class="toast">Copied</div>

<script>

let captionsData=[];
let hashtagData=[];

let shuffled=[];
let used=[];

let currentCampaign="Dior";
let currentPlatform="IG";

let isSpinning=false;

const n=t=>(t||"").toLowerCase().replace(/\s/g,"");

/* theme */
function theme(c){
  let t="dior";
  if(c==="Dior Beauty") t="beauty";
  if(c==="Dior Eye Wear") t="eyewear";
  if(c==="Cartier") t="cartier";

  document.body.dataset.theme=t;

  const glow={
    dior:"#F9B2D733",
    beauty:"#CFECF333",
    eyewear:"#DAF9DE33",
    cartier:"#F6FFDC33"
  };

  document.getElementById("cursorGlow").style.background =
    `radial-gradient(circle, ${glow[t]}, transparent 60%)`;
}

/* API */
fetch("https://script.google.com/macros/s/AKfycbxE44BEVgJBTCoAUGqwA1eDUuSjissM3Yn-qrKGhg_Rxc-VvOePowJ-VgyHbRP-fqePyA/exec")
.then(r=>r.json())
.then(d=>{
  captionsData=d.captions||[];
  hashtagData=d.hashtags||[];
  filter();
});

/* swipe */
const items=document.querySelectorAll(".campaign-item");
const slider=document.getElementById("slider");

function detect(){
  let mid=window.innerWidth/2;
  let best=null,dist=9999;

  items.forEach(i=>{
    let r=i.getBoundingClientRect();
    let d=Math.abs(mid-(r.left+r.width/2));
    if(d<dist){dist=d; best=i;}
  });

  items.forEach(i=>i.classList.remove("active"));
  best.classList.add("active");

  if(best.dataset.c!==currentCampaign){
    currentCampaign=best.dataset.c;
    theme(currentCampaign);

    currentPlatform="IG";
    document.querySelectorAll(".platform-btn").forEach(b=>b.classList.remove("active"));
    document.querySelector(".platform-btn").classList.add("active");

    filter();
  }
}

slider.addEventListener("scroll",()=>requestAnimationFrame(detect));
items.forEach(i=>i.onclick=()=>i.scrollIntoView({behavior:"smooth",inline:"center"}));

setTimeout(()=>{theme(currentCampaign);detect();},300);

/* platform */
function setPlatform(p,btn){
  currentPlatform=p;
  document.querySelectorAll(".platform-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  filter();
}

/* filter */
function filter(){
  shuffled=captionsData
    .filter(c=>n(c.campaign)===n(currentCampaign)
      && n(c.platform)===n(currentPlatform))
    .map(c=>c.caption)
    .filter(Boolean);

  if(!shuffled.length){
    shuffled=captionsData.map(c=>c.caption).filter(Boolean);
  }

  used=[];
}

/* 🔥 NEW TAG SYSTEM (ไม่จำกัด + @) */
function getAllTags(){
  const list=hashtagData
    .filter(h=>n(h.campaign)===n(currentCampaign)
      && n(h.platform)===n(currentPlatform))
    .map(h=>h.hashtags)
    .filter(Boolean);

  if(!list.length) return "";

  let all=list.join(" ")
    .replace(/\n|,/g," ")
    .split(" ")
    .filter(t=>t.startsWith("#")||t.startsWith("@"));

  return [...new Set(all)].join(" ");
}

/* spin */
function spin(){
  if(isSpinning||!shuffled.length) return;

  isSpinning=true;

  const el=document.getElementById("result");

  let i=0;
  const int=setInterval(()=>{
    el.innerText=shuffled[Math.floor(Math.random()*shuffled.length)];
    if(i++>15){
      clearInterval(int);

      const cap=shuffled.pop();
      used.push(cap);

      let text=cap;

      const tags=getAllTags();
      if(tags) text+="\n\n"+tags;

      el.innerText=text;
      el.classList.add("show");

      isSpinning=false;
    }
  },70);
}

/* copy */
function copy(){
  const t=document.getElementById("result").innerText;
  if(!t) return;

  navigator.clipboard.writeText(t);

  const toast=document.getElementById("toast");
  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),1500);
}

/* cursor */
document.addEventListener("mousemove",e=>{
  const g=document.getElementById("cursorGlow");
  g.style.left=e.clientX+"px";
  g.style.top=e.clientY+"px";
});

</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js");
  });
}
</script>

</body>
</html>
