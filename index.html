<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>00K Captions</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F9B2D7">
<link rel="apple-touch-icon" href="icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root{
  --accent:#F9B2D7;
  --accent2:#CFECF3;
}

body[data-theme="Fashion"]{ --accent:#F9B2D7; --accent2:#CFECF3; }
body[data-theme="Beauty"]{ --accent:#CFECF3; --accent2:#DAF9DE; }
body[data-theme="EyeWear"]{ --accent:#DAF9DE; --accent2:#F6FFDC; }
body[data-theme="PFW"]{  --accent:#D9C2FF;  --accent2:#FFE8F5;}
body[data-theme="Cartier"]{ --accent:#F6FFDC; --accent2:#F9B2D7; }

body{
  margin:0;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#111;
  font-family:'Plus Jakarta Sans',sans-serif;
  display:flex;
  justify-content:center;
  padding:20px;
}


/* 🎨 dynamic backgrounds */
body[data-theme="Fashion"]{
  background:
    radial-gradient(circle at 20% 20%, #F9B2D722, transparent 40%),
    radial-gradient(circle at 80% 80%, #CFECF322, transparent 40%),
    #000;
}

body[data-theme="Beauty"]{
  background:
    radial-gradient(circle at 20% 20%, #CFECF322, transparent 40%),
    radial-gradient(circle at 80% 80%, #DAF9DE22, transparent 40%),
    #000;
}

body[data-theme="EyeWear"]{
  background:
    radial-gradient(circle at 20% 20%, #DAF9DE22, transparent 40%),
    radial-gradient(circle at 80% 80%, #F6FFDC22, transparent 40%),
    #000;
}

body[data-theme="PFW"]{
  background:
    radial-gradient(circle at 20% 20%, #D9C2FF22, transparent 40%),
    radial-gradient(circle at 80% 80%, #FFE8F522, transparent 40%),
    #000;
}

body[data-theme="Cartier"]{
  background:
    radial-gradient(circle at 20% 20%, #F6FFDC22, transparent 40%),
    radial-gradient(circle at 80% 80%, #F9B2D722, transparent 40%),
    #000;
}


/* card */
.card{
  width:100%;
  max-width:500px;
  display:flex;
  flex-direction:column;
  gap:16px;

  background:rgba(255,255,255,0.7);
  backdrop-filter:blur(12px);
  border-radius:20px;
  padding:18px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
}


/* title */
h1{
  font-family:'Outfit',sans-serif;
  font-weight:600;
  margin:0;
  color:#111;
}


/* status */
.status{
  font-size:12px;
  opacity:.6;
}

/* campaign */
.campaign-slider{
  display:flex;
  overflow-x:auto;
  gap:12px;
  scroll-snap-type:x mandatory;
}
.campaign-slider::-webkit-scrollbar{display:none;}

.campaign-item{
  flex:0 0 70%;
  padding:14px;
  border-radius:18px;
  background:rgba(255,255,255,0.6);
  transform:scale(.85);
  opacity:.5;
  transition:.3s;
  border:1px solid rgba(0,0,0,0.05);
}

.campaign-item.active{
  transform:scale(1);
  opacity:1;
  background:#fff;
  color:#000;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
}


/* platform scroll */
.platform-row{
  display:flex;
  gap:10px;
}

.platform-btn{
  flex:1; /* 🔥 ทำให้เท่ากัน */
  text-align:center;
  font-size:14px;
  padding:10px 0;
  border-radius:20px;
  border:1px solid rgba(0,0,0,0.1);
  background:#fff;
  color:#333;
}

.platform-btn.active{
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:#000;
}


/* actions */
.actions{
  display:flex;
  gap:10px;
}

.main-btn{
  flex:1;
  padding:14px;
  border-radius:20px;
  border:none;
  background:#000;
  color:#fff;
  font-weight:600;
}

.copy-btn{
  flex:.6;
}

/* result */
.result{
  min-height:110px;
  padding:16px;
  border-radius:16px;
  background:#fff;
  border:1px solid rgba(0,0,0,0.08);
  white-space:pre-line;
  opacity:0;
  color:#111;
}
.result.show{opacity:1;}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#fff;
  color:#000;
  padding:10px 20px;
  border-radius:20px;
  opacity:0;
}
.toast.show{opacity:1;}

.brand-tabs{
  display:flex;
  gap:10px;
}

.brand-btn{
  flex:1;
  padding:12px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,0.2);
  background:rgba(255,255,255,0.05);
  color:#fff;
  font-weight:600;
}

.brand-btn.active{
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:#000;
}

</style>

</head>

<body data-theme="Fashion">

<div id="cursorGlow"></div>

<div class="card">

<h1>00K CAPTIONS</h1>

<div class="brand-tabs">
  <button class="brand-btn active" onclick="setBrand('Dior',this)">Dior</button>
  <button class="brand-btn" onclick="setBrand('Cartier',this)">Cartier</button>
</div>

<div class="status" id="statusText">Fashion • IG</div>
<div class="campaign-slider" id="slider">
  <div class="campaign-item active" data-c="Dior_Fashion">Fashion</div>
  <div class="campaign-item" data-c="Dior_Beauty">Beauty</div>
  <div class="campaign-item" data-c="Dior_EyeWear">Eyewear</div>
  <div class="campaign-item" data-c="Dior_PFW">PFW</div>
  <div class="campaign-item" data-c="Cartier">Cartier</div>
</div>

<div class="platform-row">
  <button class="platform-btn active" onclick="setPlatform('IG',this)">IG</button>
  <button class="platform-btn" onclick="setPlatform('X',this)">X</button>
</div>

<div class="actions">
  <button class="main-btn" onclick="spin()">✨ RANDOM</button>
  <button class="main-btn copy-btn" onclick="copy()">COPY</button>
</div>

<div id="result" class="result"></div>

</div>

<div id="toast" class="toast">Copied</div>

<script>

let captionsData = [], hashtagData = [];
let shuffled = [], used = [];

let currentBrand = "Dior";
let currentCampaign = "Dior_Fashion";
let currentPlatform = "IG";

let isSpinning = false;

const n = t => (t || "")
  .toLowerCase()
  .replace(/\s|_/g, "");

/* STATUS */
function updateStatus() {
  let label = currentCampaign
    .replace("Dior_", "")
    .replace("_", " ");

  document.getElementById("statusText").innerText =
    label + " • " + currentPlatform;
}

/* BRAND SWITCH */
function setBrand(brand, btn) {
  currentBrand = brand;

  document.querySelectorAll(".brand-btn")
    .forEach(b => b.classList.remove("active"));
  btn.classList.add("active");

  const items = document.querySelectorAll(".campaign-item");

  let firstVisible = null;

  items.forEach(i => {
    const c = i.dataset.c;

    let show = false;

    if (brand === "Dior") {
      show = c.startsWith("Dior");
    } else if (brand === "Cartier") {
      show = c === "Cartier";
    }

    i.style.display = show ? "block" : "none";

    if (show && !firstVisible) {
      firstVisible = i;
    }
  });

  // ❗ FIX: set campaign ให้ตรงตัวแรกที่เห็น
  if (firstVisible) {
    currentCampaign = firstVisible.dataset.c;

    items.forEach(i => i.classList.remove("active"));
    firstVisible.classList.add("active");

    firstVisible.scrollIntoView({
      behavior: "smooth",
      inline: "center"
    });
  }

  // reset platform
  currentPlatform = "IG";

  document.querySelectorAll(".platform-btn")
    .forEach(b => b.classList.remove("active"));

  document.querySelector(".platform-btn").classList.add("active");

  theme(currentCampaign);
  updateStatus();
  filter();
}

/* THEME (FIXED) */
function theme(c) {
  let t = "Fashion";
  
  if (c === "Dior_Fashion") t = "Fashion";
  if (c === "Dior_Beauty") t = "Beauty";
  if (c === "Dior_EyeWear") t = "EyeWear";
  if (c === "Dior_PFW") t = "PFW";
  if (c === "Cartier") t = "Cartier";

  document.body.dataset.theme = t;
}

/* API */
fetch("https://script.google.com/macros/s/AKfycbwLXSog_nkbwnrRHBjZ4i35SSYiRmgNNPZL3YeGitAJlDceXYkJw0gLQ9zvc8Ra7ivc6w/exec")
.then(r => r.json())
.then(d => {
  captionsData = d.captions || [];
  hashtagData = d.hashtags || [];
  filter();
});

/* SWIPE */
const items = document.querySelectorAll(".campaign-item");
const slider = document.getElementById("slider");

function detect() {
  let mid = window.innerWidth / 2;
  let best = null;
  let dist = 9999;

  document.querySelectorAll(".campaign-item").forEach(i => {

    if (i.style.display === "none") return;

    let r = i.getBoundingClientRect();
    let d = Math.abs(mid - (r.left + r.width / 2));

    if (d < dist) {
      dist = d;
      best = i;
    }
  });

  if (!best) return;

  document.querySelectorAll(".campaign-item")
    .forEach(i => i.classList.remove("active"));

  best.classList.add("active");

  if (best.dataset.c !== currentCampaign) {
    currentCampaign = best.dataset.c;

    theme(currentCampaign);

    currentPlatform = "IG";

    document.querySelectorAll(".platform-btn")
      .forEach(b => b.classList.remove("active"));

    document.querySelector(".platform-btn").classList.add("active");

    updateStatus();
    filter();
  }
}

const glow={
  Fashion:"#F9B2D744",
  Beauty:"#CFECF344",
  EyeWear:"#DAF9DE44",
  PFW:"#D9C2FF44",
  Cartier:"#F6FFDC44"
};

slider.addEventListener("scroll", () => requestAnimationFrame(detect));

items.forEach(i =>
  i.onclick = () =>
    i.scrollIntoView({ behavior: "smooth", inline: "center" })
);

/* PLATFORM */
function setPlatform(p, btn) {
  currentPlatform = p;

  document.querySelectorAll(".platform-btn")
    .forEach(b => b.classList.remove("active"));

  btn.classList.add("active");

  updateStatus();
  filter();
}

/* FILTER */
function filter() {
  const el = document.getElementById("result");

  shuffled = captionsData
    .filter(c => {
      const brandMatch =
        n(c.brand) === n(currentBrand);

      const campaignMatch =
        n(c.campaign) === n(currentCampaign);

      return brandMatch && campaignMatch;
    })
    .map(c => c.caption)
    .filter(Boolean);

  used = [];

  el.innerText = "";
  el.classList.remove("show");

  if (!shuffled.length) {
    el.innerText = "No caption found";
    el.classList.add("show");
  }
}


function getAllTags() {
  const list = hashtagData
    .filter(h =>
      n(h.brand) === n(currentBrand) &&
      n(h.campaign) === n(currentCampaign) &&
      n(h.platform) === n(currentPlatform)
    )
    .map(h => h.hashtags)
    .filter(Boolean);

  if (!list.length) return "";

  let all = list.join(" ")
    .replace(/\n|,/g, " ")
    .split(" ")
    .map(t => t.trim())
    .filter(t => t.startsWith("#") || t.startsWith("@"));

  return [...new Set(all)].join(" ");
}


/* SPIN */
function spin() {
  if (isSpinning || !shuffled.length) return;

  isSpinning = true;
  const el = document.getElementById("result");

  let i = 0;

  const int = setInterval(() => {
    el.innerText = shuffled[Math.floor(Math.random() * shuffled.length)];

    if (i++ > 15) {
      clearInterval(int);

      const cap = shuffled.pop();
      used.push(cap);

      let text = cap;

      const tags = getAllTags();
      if (tags) text += "\n\n" + tags;

      el.innerText = text;
      el.classList.add("show");

      isSpinning = false;
    }
  }, 70);
}

/* COPY */
function copy() {
  const t = document.getElementById("result").innerText;
  if (!t) return;

  navigator.clipboard.writeText(t);

  const toast = document.getElementById("toast");
  toast.classList.add("show");

  setTimeout(() => toast.classList.remove("show"), 1500);
}

/* INIT */
setTimeout(() => {
  setBrand("Dior", document.querySelector(".brand-btn"));
}, 300);

</script>


</body>
</html>
