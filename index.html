<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dior AW26 Caption Tool</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

/* 💰 GOLD THEME */
:root{
  --gold:#d4af37;
}

/* 🌑 background */
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:'Inter',sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
}

/* 🎞 grain */
.grain{
  position:fixed;
  width:100%;
  height:100%;
  pointer-events:none;
  opacity:0.05;
  background-image:url("https://grainy-gradients.vercel.app/noise.svg");
}

/* ✨ cursor glow */
#cursorGlow{
  position:fixed;
  width:300px;
  height:300px;
  border-radius:50%;
  pointer-events:none;
  background: radial-gradient(circle, rgba(212,175,55,0.15), transparent 60%);
  transform:translate(-50%,-50%);
}

/* 💎 card */
.card{
  width:90%;
  max-width:600px;
  text-align:center;
  padding:40px;
  border-radius:20px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.1);
}

/* title */
h1{
  font-family:'Playfair Display',serif;
  background:linear-gradient(90deg,#fff,var(--gold));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* buttons */
button{
  margin:5px;
  padding:10px 20px;
  border-radius:20px;
  border:1px solid rgba(255,255,255,0.3);
  background:transparent;
  color:#fff;
  cursor:pointer;
}

button.active,
button:hover{
  background:linear-gradient(90deg,var(--gold),#fff);
  color:#000;
}

/* main */
.main-btn{
  margin-top:15px;
  border:none;
  background:linear-gradient(90deg,var(--gold),#fff);
  color:#000;
}

/* result */
.result{
  margin-top:30px;
  font-size:20px;
  min-height:120px;
  opacity:0;
  transition:.5s;
  white-space:pre-line;
}

.result.show{
  opacity:1;
}

.result.glow{
  animation:glow 1.5s infinite;
}

@keyframes glow{
  0%{opacity:.6;}
  50%{opacity:1;}
  100%{opacity:.6;}
}

.counter{
  font-size:12px;
  opacity:.5;
}

/* toast */
.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#fff;
  color:#000;
  padding:10px 20px;
  border-radius:20px;
  opacity:0;
  transition:.3s;
}

.toast.show{opacity:1;}

</style>
</head>

<body>

<div class="grain"></div>
<div id="cursorGlow"></div>

<div class="card">

<h1>DIOR AW26 CAPTIONS</h1>

<div>
  <button class="active" onclick="setPlatform('IG',this)">IG</button>
  <button onclick="setPlatform('X',this)">X</button>
</div>

<div>
  <button class="active" onclick="setCampaign('Dior',this)">Dior</button>
  <button onclick="setCampaign('Dior Beauty',this)">Beauty</button>
  <button onclick="setCampaign('Dior Eye Wear',this)">Eyewear</button>
</div>

<button class="main-btn" onclick="playSound(); spin()">RANDOM</button>
<button class="main-btn" onclick="playSound(); copy()">COPY</button>
<button class="main-btn" onclick="toggleAuto()">AUTO</button>

<div>
<select onchange="hashtagCount=this.value">
<option value="3">3 hashtags</option>
<option value="5">5 hashtags</option>
<option value="10">10 hashtags</option>
</select>
</div>

<div id="result" class="result"></div>
<div id="counter" class="counter"></div>

</div>

<div id="toast" class="toast">Copied</div>

<audio id="clickSound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>

<script>

let captionsData=[];
let hashtagData=[];
let shuffled=[];

let currentPlatform="IG";
let currentCampaign="Dior";
let hashtagCount=3;

let autoMode=false;
let autoInterval;

// 👉 API ของคุณ
fetch("https://script.google.com/macros/s/AKfycbzvCqSpk5FqqU7O7fWIpe5AUJ1iiELOT2pPRi5ITawqZzV7SCNEmE0YuVnLwFOxZWAu5g/exec")
.then(res=>res.json())
.then(data=>{
  captionsData=data.captions||[];
  hashtagData=data.hashtags||[];
  filterData();
});

// cursor glow
document.addEventListener("mousemove",e=>{
  const g=document.getElementById("cursorGlow");
  g.style.left=e.clientX+"px";
  g.style.top=e.clientY+"px";
});

// platform
function setPlatform(p,btn){
  currentPlatform=p;
  document.querySelectorAll("button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  filterData();
}

// campaign
function setCampaign(c,btn){
  currentCampaign=c;
  btn.classList.add("active");
  filterData();
}

// filter
function filterData(){
  shuffled=captionsData
  .filter(c=>c.platform.toUpperCase()==currentPlatform && c.campaign==currentCampaign)
  .map(c=>c.captions);

  shuffle();

  document.getElementById("counter").innerText=shuffled.length+" captions";
}

// shuffle
function shuffle(){
  for(let i=shuffled.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];
  }
}

// hashtags
function getRandomHashtags(){
  const list=hashtagData
  .filter(h=>h.platform.toUpperCase()==currentPlatform && h.campaign==currentCampaign)
  .map(h=>h.hashtags);

  let all=list.join(" ").split(" ");

  return all.slice(0,hashtagCount).join(" ");
}

// spin
function spin(){

  const el=document.getElementById("result");
  el.classList.add("glow");

  let i=0;

  const interval=setInterval(()=>{

    el.innerText=shuffled[Math.floor(Math.random()*shuffled.length)];
    el.style.opacity=0.3;

    i++;

    if(i>15){

      clearInterval(interval);

      const caption=shuffled.pop();
      const hashtag=getRandomHashtags();

      let text=caption+"\n\n"+hashtag+"\n\n— Lingling Kwong";

      el.innerText=text;
      el.classList.remove("glow");
      el.classList.add("show");
      el.style.opacity=1;

      document.getElementById("counter").innerText=shuffled.length+" left";
    }

  },70);
}

// copy
function copy(){
  const text=document.getElementById("result").innerText;
  navigator.clipboard.writeText(text);

  const t=document.getElementById("toast");
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),1500);
}

// auto
function toggleAuto(){
  autoMode=!autoMode;

  if(autoMode){
    autoInterval=setInterval(()=>spin(),4000);
  }else{
    clearInterval(autoInterval);
  }
}

// sound
function playSound(){
  const s=document.getElementById("clickSound");
  s.currentTime=0;
  s.play();
}

</script>

</body>
</html>
