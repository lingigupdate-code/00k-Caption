<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>00K Captions Tool</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

/* GOLD THEME */
:root{
  --gold:#d4af37;
}

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:'Inter',sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
}

/* grain */
.grain{
  position:fixed;
  width:100%;
  height:100%;
  opacity:0.05;
  pointer-events:none;
  background-image:url("https://grainy-gradients.vercel.app/noise.svg");
}

/* cursor glow */
#cursorGlow{
  position:fixed;
  width:300px;
  height:300px;
  border-radius:50%;
  pointer-events:none;
  background: radial-gradient(circle, rgba(212,175,55,0.15), transparent 60%);
  transform:translate(-50%,-50%);
}

/* card */
.card{
  width:90%;
  max-width:600px;
  padding:40px;
  border-radius:20px;
  text-align:center;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.1);
}

/* title */
h1{
  font-family:'Playfair Display',serif;
  background:linear-gradient(90deg,#fff,var(--gold));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* buttons */
button{
  margin:5px;
  padding:10px 20px;
  border-radius:20px;
  border:1px solid rgba(255,255,255,0.3);
  background:transparent;
  color:#fff;
  cursor:pointer;
}

button.active,
button:hover{
  background:linear-gradient(90deg,var(--gold),#fff);
  color:#000;
}

.main-btn{
  margin-top:15px;
  border:none;
  background:linear-gradient(90deg,var(--gold),#fff);
  color:#000;
}

/* result */
.result{
  margin-top:30px;
  font-size:20px;
  min-height:120px;
  opacity:0;
  transition:.5s;
  white-space:pre-line;
}

.result.show{opacity:1;}

.result.glow{
  animation:glow 1.5s infinite;
}

@keyframes glow{
  0%{opacity:.6;}
  50%{opacity:1;}
  100%{opacity:.6;}
}

.counter{
  font-size:12px;
  opacity:.5;
}

/* toast */
.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#fff;
  color:#000;
  padding:10px 20px;
  border-radius:20px;
  opacity:0;
  transition:.3s;
}

.toast.show{opacity:1;}

</style>
</head>

<body>

<div class="grain"></div>
<div id="cursorGlow"></div>

<div class="card">

<h1>00K CAPTIONS</h1>

<!-- platform -->
<div>
  <button class="platform-btn active" onclick="setPlatform('IG',this)">IG</button>
  <button class="platform-btn" onclick="setPlatform('X',this)">X</button>
</div>

<!-- campaign -->
<div>
  <button class="campaign-btn active" onclick="setCampaign('Dior',this)">Dior</button>
  <button class="campaign-btn" onclick="setCampaign('Dior Beauty',this)">Beauty</button>
  <button class="campaign-btn" onclick="setCampaign('Dior Eye Wear',this)">Eyewear</button>
</div>

<button class="main-btn" onclick="playSound(); spin()">RANDOM</button>
<button class="main-btn" onclick="playSound(); copy()">COPY</button>
<button class="main-btn" onclick="toggleAuto()">AUTO</button>

<div>
<select onchange="hashtagCount=this.value">
<option value="3">3 hashtags</option>
<option value="5">5 hashtags</option>
<option value="10">10 hashtags</option>
</select>
</div>

<div id="result" class="result"></div>
<div id="counter" class="counter"></div>

</div>

<div id="toast" class="toast">Copied</div>

<audio id="clickSound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>


<script>

let captionsData=[];
let hashtagData=[];

let shuffled=[];
let usedCaptions=[];

let currentPlatform="IG";
let currentCampaign="Dior";
let hashtagCount=3;

let autoMode=false;
let autoInterval=null;
let isSpinning=false;

// 🔥 normalize กันพัง
function normalize(text){
  return (text || "")
    .toString()
    .toLowerCase()
    .replace(/\s+/g,"")
    .trim();
}

// 🔥 API
fetch("https://script.google.com/macros/s/AKfycbzvCqSpk5FqqU7O7fWIpe5AUJ1iiELOT2pPRi5ITawqZzV7SCNEmE0YuVnLwFOxZWAu5g/exec")
.then(res=>res.json())
.then(data=>{
  console.log("API:", data);

  captionsData = data.captions || [];
  hashtagData = data.hashtags || [];

  if(captionsData.length === 0){
    document.getElementById("result").innerText = "No captions found";
    return;
  }

  filterData();
})
.catch(()=>{
  document.getElementById("result").innerText = "API error";
});

// cursor glow
document.addEventListener("mousemove",e=>{
  const g=document.getElementById("cursorGlow");
  g.style.left=e.clientX+"px";
  g.style.top=e.clientY+"px";
});

// platform
function setPlatform(p,btn){
  currentPlatform=p;

  document.querySelectorAll(".platform-btn")
    .forEach(b=>b.classList.remove("active"));

  btn.classList.add("active");

  filterData();
}

// campaign
function setCampaign(c,btn){
  currentCampaign=c;

  document.querySelectorAll(".campaign-btn")
    .forEach(b=>b.classList.remove("active"));

  btn.classList.add("active");

  filterData();
}

// 🔥 filter แบบกันพัง + fallback
function filterData(){

  shuffled = captionsData
    .filter(c =>
      normalize(c.platform) === normalize(currentPlatform) &&
      normalize(c.campaign) === normalize(currentCampaign)
    )
    .map(c => c.caption)
    .filter(Boolean);

  // 💥 fallback ถ้า 0
  if(shuffled.length === 0){
    console.warn("No match → fallback ALL captions");
    shuffled = captionsData.map(c => c.caption).filter(Boolean);
  }

  usedCaptions=[];
  shuffle();

  document.getElementById("counter").innerText =
    shuffled.length + " captions";

  document.getElementById("result").innerText = "Ready ✨";
}

// shuffle
function shuffle(){
  for(let i=shuffled.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];
  }
}

// 🔥 hashtag ฉลาดขึ้น
function getRandomHashtags(){

  const list = hashtagData
    .filter(h =>
      normalize(h.platform) === normalize(currentPlatform) &&
      normalize(h.campaign) === normalize(currentCampaign)
    )
    .map(h => h.hashtags)
    .filter(Boolean);

  if(list.length===0) return "";

  let all = list
    .join(" ")
    .replace(/\n/g," ")
    .replace(/,/g," ")
    .split(" ")
    .filter(tag => tag.startsWith("#"));

  // shuffle
  for(let i=all.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [all[i],all[j]]=[all[j],all[i]];
  }

  return all.slice(0,hashtagCount).join(" ");
}

// spin
function spin(){

  if(isSpinning) return;
  if(shuffled.length === 0 && usedCaptions.length === 0) return;

  isSpinning = true;

  if(shuffled.length===0){
    shuffled=[...usedCaptions];
    usedCaptions=[];
    shuffle();
  }

  const el=document.getElementById("result");
  el.classList.add("glow");

  let i=0;

  const interval=setInterval(()=>{

    el.innerText =
      shuffled[Math.floor(Math.random()*shuffled.length)];

    el.style.opacity=0.3;

    i++;

    if(i>15){

      clearInterval(interval);

      const caption = shuffled.pop();
      usedCaptions.push(caption);

      const hashtag = getRandomHashtags();

      let text = caption;

      if(hashtag){
        text += "\n\n" + hashtag;
      }

      text += "\n\n— Lingling Kwong";

      el.innerText=text;
      el.classList.remove("glow");
      el.classList.add("show");
      el.style.opacity=1;

      document.getElementById("counter").innerText =
        shuffled.length + " left";

      isSpinning = false;
    }

  },70);
}

// copy
function copy(){
  const text=document.getElementById("result").innerText;
  if(!text) return;

  navigator.clipboard.writeText(text);

  const t=document.getElementById("toast");
  t.classList.add("show");

  setTimeout(()=>t.classList.remove("show"),1500);
}

// auto
function toggleAuto(){

  autoMode = !autoMode;

  if(autoMode){

    if(autoInterval) clearInterval(autoInterval);

    autoInterval = setInterval(()=>spin(),4000);

  }else{
    clearInterval(autoInterval);
    autoInterval = null;
  }
}

// sound
function playSound(){
  const s=document.getElementById("clickSound");
  s.currentTime=0;
  s.play().catch(()=>{});
}

</script>
