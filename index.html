<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>00K Captions</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#F9B2D7">
    <link rel="apple-touch-icon" href="icon-192.png">

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
    /* --- 1. Variables & Global Styles --- */
    :root { 
        --accent: #F9B2D7; 
        --accent2: #CFECF3; 
    }

    /* Theme-based Color Definitions */
    body[data-theme="Fashion"] { --accent: #F9B2D7; --accent2: #CFECF3; }
    body[data-theme="Beauty"]  { --accent: #CFECF3; --accent2: #DAF9DE; }
    body[data-theme="EyeWear"] { --accent: #DAF9DE; --accent2: #F6FFDC; }
    body[data-theme="PFW"]     { --accent: #D9C2FF; --accent2: #FFE8F5; }
    body[data-theme="Cartier"] { --accent: #F6FFDC; --accent2: #F9B2D7; }

    body {
        margin: 0; 
        color: #111; 
        font-family: 'Plus Jakarta Sans', sans-serif;
        display: flex; 
        justify-content: center; 
        align-items: center; 
        padding: 0;
	height: 100vh; /* ล็อกความสูง body */
	width: 100vw;
        overflow-x: hidden; 
        box-sizing: border-box; 
        background-color: #000;
	background-attachment: fixed;
    	background-position: center;
     	background-repeat: no-repeat !important; /* ใส่ !important เพื่อป้องกันการโดนทับ */
    	background-size: contain !important;       /* ใช้ cover เพื่อให้เต็มจอและไม่เกิดช่องว่างจนต้อง repeat */
    }

    #cursorGlow { 
        position: fixed; 
        width: 300px; 
        height: 300px; 
        border-radius: 50%; 
        pointer-events: none; 
        transform: translate(-50%, -50%); 
        filter: blur(40px); 
        mix-blend-mode: screen; 
        z-index: 1; 
    }


    body[data-theme="Fashion"] { background-color: #1d1b1c; background-image: linear-gradient(rgba(0,0,0,.28), rgba(0,0,0,.28)), url("https://lingigupdate-code.github.io/00k-Caption/image/fashion.jpg"); }
    body[data-theme="Beauty"]  { background-color: #d9d0cf; background-image: linear-gradient(rgba(0,0,0,.18), rgba(0,0,0,.18)), url("https://lingigupdate-code.github.io/00k-Caption/image/beauty.jpg"); }
    body[data-theme="EyeWear"] { background-color: #cfc7b8; background-image: linear-gradient(rgba(0,0,0,.20), rgba(0,0,0,.20)), url("https://lingigupdate-code.github.io/00k-Caption/image/eyewear.jpg"); }
    body[data-theme="PFW"]     { background-color: #2a2328; background-image: linear-gradient(rgba(0,0,0,.30), rgba(0,0,0,.30)), url("https://lingigupdate-code.github.io/00k-Caption/image/pfw.jpg"); }
    body[data-theme="Cartier"] { background-color: #b8aa8c; background-image: linear-gradient(rgba(0,0,0,.18), rgba(0,0,0,.18)), url("https://lingigupdate-code.github.io/00k-Caption/image/cartier.jpg"); }

    /* --- 3. Container & Card Layout --- */
    .container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 10px;
        width: 100%;
        max-width: 400px;
        min-height: 100vh;
        margin: 0 auto;
	padding: 15px;
            box-sizing: border-box;
    }

    .card {
    position: relative; 
    z-index: 2; 
    width: 100%;
    display: flex; 
    flex-direction: column; 
    gap: 8px; /* เพิ่มช่องไฟระหว่างส่วนต่างๆ */
    background: rgba(255, 255, 255, 0.07); /* ปรับความสว่างให้ใกล้เคียงกัน */
    backdrop-filter: blur(15px); 
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.12); 
    border-radius: 20px; /* มนขึ้นดูทันสมัย */
    padding: 16px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
    box-sizing: border-box;
    }

    .bio-card { flex-shrink: 0; }
    .gen-card { flex-grow: 0; overflow-y: visible; }

    h1, .section-title { 
        font-family: 'Outfit', sans-serif; 
        font-weight: 600; 
        margin: 0; 
        color: #fff; 
        text-shadow: 0 2px 12px rgba(0,0,0,.35); 
        letter-spacing: .5px; 
        text-align: center; 
        font-size: 18px; 
    }

    /* --- 4. Social Header & Business Button --- */
    .social-header { 
    margin: 0; 
    padding: 0; /* เอา padding ออกเพื่อให้ดูโปร่ง */
    background: transparent; 
    border: none; 
    }

    .footer-label { 
    font-size: 11px; 
    font-weight: 600;
    text-transform: uppercase; 
    color: rgba(255, 255, 255, 0.4); 
    letter-spacing: 2px; 
    text-align: center; /* เปลี่ยนเป็นชิดซ้ายให้ดูเหมือน Label ของ Input */
    margin-bottom: 10px; 
    padding-left: 5px;
    }

    .social-grid { 
    display: grid; 
    grid-template-columns: repeat(3, 1fr); 
    gap: 8px; /* เพิ่มระยะห่างปุ่ม */
    }

    .social-item {
    display: flex; 
    flex-direction: column; /* เรียง Icon บน Text ล่าง */
    align-items: center; 
    justify-content: center; 
    gap: 6px; 
    padding: 12px 8px;
    text-decoration: none; 
    font-size: 10px; 
    font-weight: 500;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.05); 
    color: rgba(255, 255, 255, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.08); 
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .social-item.has-image { flex-direction: column; padding: 8px 4px; text-align: center; }
    .social-item img { 
    width: 24px; 
    height: 24px; 
    object-fit: contain; 
    filter: brightness(1.2); /* ช่วยให้ icon ชัดขึ้น */
    }
    .social-item:hover { 
    background: rgba(255, 255, 255, 0.12); 
    color: #fff; 
    transform: translateY(-3px); 
    border-color: var(--accent); 
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .business-btn {
    display: flex; 
    align-items: center; 
    justify-content: center; 
    gap: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #000; 
    text-decoration: none; 
    padding: 14px; 
    border-radius: 16px;
    font-weight: 700; 
    font-size: 13px; 
    margin-top: 5px;
    transition: 0.3s;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .business-btn:hover {
    transform: scale(1.02);
    box-shadow: 0 6px 20px rgba(249, 178, 215, 0.3);
    }

    /* --- 5. Interactive UI (Tabs, Sliders, Buttons) --- */
    .brand-tabs { display: flex; gap: 3px; }
    .brand-btn { 
        flex: 1; padding: 12px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); 
        background: rgba(255,255,255,0.05); color: #fff; cursor: pointer; transition: 0.3s; font-weight: 600; 
    }
    .brand-btn.active { background: #fff; color: #000; }

    .campaign-slider {
        display: flex; overflow-x: auto; gap: 5px; padding: 4px 22px;
        scroll-snap-type: x mandatory; scroll-padding: 22px;
    }
    .campaign-slider::-webkit-scrollbar { display: none; }

    .campaign-item {
        flex: 0 0 64%; cursor: pointer; transition: 0.3s;
        padding: 14px; border-radius: 18px; background: rgba(255,255,255,0.06);
        color: rgba(255,255,255,.78); backdrop-filter: blur(8px);
        transform: scale(.88); opacity: .72; border: 1px solid rgba(255,255,255,0.1);
        scroll-snap-align: center;
    }
    .campaign-item.active { transform: scale(1); opacity: 1; background: rgba(255,255,255,.72); color: #111; }

    .slider-dots { display: flex; justify-content: center; gap: 3px; margin: -5px 0 10px 0; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.2); transition: 0.3s; }
    .dot.active { background: var(--accent); transform: scale(1.3); }

    .platform-row { display: flex; gap: 3px; margin-bottom: 2px; }
    .platform-btn { 
        flex: 1; padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); 
        background: rgba(255,255,255,0.05); color: #fff; cursor: pointer; 
    }
    .platform-btn.active { background: linear-gradient(90deg, var(--accent), var(--accent2)); color: #000; font-weight: 600; }

    .status { font-size: 12px; color: rgba(255,255,255,0.6); text-align: center; }

    /* --- 6. Actions & Results --- */
    .actions { display: flex; gap: 3px; margin-top: 5px; width: 100%; }
    .main-btn { 
        flex: 2.5; padding: 12px; border-radius: 14px; border: none; 
        background: var(--accent); color: #000; font-weight: 800; 
        cursor: pointer; transition: 0.2s; font-size: 14px;
    }
    .copy-btn { 
        flex: 1; background: rgba(255,255,255,0.12); color: #fff; 
        border: 1px solid rgba(255,255,255,0.1); font-weight: 600; font-size: 12px;
    }

    .result { 
        padding: 10px; border-radius: 15px; background: rgba(255,255,255,0.05); 
        border: 1px solid rgba(255,255,255,0.1); color: #fff; min-height: 100px; 
        white-space: pre-line; display: none; margin-top: 5px; overflow-y: auto; 
     	font-size: 13px !important;
    }
    .result.show { display: block !important; }

    .toast { 
        position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); 
        background: var(--accent); color: #000; padding: 10px 20px; border-radius: 20px; 
        font-weight: 600; opacity: 0; transition: 0.3s; pointer-events: none; z-index: 999; 
    }
    .toast.show { opacity: 1; }

    /* --- 7. Responsive Design (Mobile) --- */
    @media (max-width: 480px) {
        .container { padding: 10px; justify-content: center; gap: 8px; }
        .card { padding: 20px; gap: 12px; }
        .social-grid { gap: 6px; }
        .social-header { gap: 3px; padding: 8px !important; margin: 0 !important; }
        .social-item { padding: 6px 4px; }
        .social-item img { width: 16px !important; height: 16px !important; }

        .brand-btn, .platform-btn { padding: 8px !important; font-size: 11px !important; }
        .campaign-slider { padding: 5px 0 !important; }
        
        .actions { margin-bottom: 5px; }
        .main-btn { padding: 12px !important; font-size: 13px !important; }
        
        .result { font-size: 14px !important; border: 1px solid var(--accent) !important; }
    }

</style>

</head>

<!-- ส่วนของโครงสร้างใหม่ภายใน card gen-card -->
<div class="card gen-card">
    <h2 class="section-title">00K RANDOM CAPTIONS</h2>
    
    <!-- 1. เลือกแบรนด์ -->
    <div class="brand-tabs">
        <button class="brand-btn active" onclick="setBrand('Dior',this)">Dior</button>
        <button class="brand-btn" onclick="setBrand('Cartier',this)">Cartier</button>
    </div>

   

    <!-- 2. Slider เลือกแคมเปญ (คลิกที่ตัวแคมเปญเพื่อเลือกได้เลย) -->
      <div class="campaign-slider" id="slider">
    <div class="campaign-item active" data-c="Dior_Fashion" onclick="selectCampaign(this)">Fashion</div>
    <div class="campaign-item" data-c="Dior_Beauty" onclick="selectCampaign(this)">Beauty</div>
    <div class="campaign-item" data-c="Dior_EyeWear" onclick="selectCampaign(this)">Eyewear</div>
    <div class="campaign-item" data-c="Dior_PFW" onclick="selectCampaign(this)">PFW</div>
    <div class="campaign-item" data-c="Cartier" onclick="selectCampaign(this)" style="display:none;">Cartier</div>
  </div>
    <div class="slider-dots" id="dotsContainer"></div>

    <!-- 3. เลือกแพลตฟอร์ม -->
    <div class="platform-row">
        <button class="platform-btn active" onclick="setPlatform('IG',this)">IG</button>
        <button class="platform-btn" onclick="setPlatform('X',this)">X</button>
    </div>

<div class="status" id="statusText">Fashion • IG</div>

    <!-- 4. ปุ่ม Random และ Copy (ย้ายมาไว้ตรงนี้) -->
    <div class="actions">
        <button class="main-btn" onclick="spin()">✨ RANDOM CAPTION</button>
        <button class="main-btn copy-btn" onclick="copy()">COPY</button>
    </div>

    <!-- 5. กล่องแสดงผลลัพธ์ -->
    <div id="result" class="result"></div>
</div>

    <div id="toast" class="toast">Copied to Clipboard!</div>

    <script>
    let captionsData = [], hashtagData = [];
    let currentBrand = "Dior", currentCampaign = "Dior_Fashion", currentPlatform = "IG", isSpinning = false;
    let isInternalScrolling = false;

    const slider = document.getElementById("slider");
    const n = t => (t || "").toLowerCase().replace(/\s|_/g, "");

    function updateStatus() {
        let label = currentCampaign.replace("Dior_", "").replace("_", " ");
        document.getElementById("statusText").innerText = label + " • " + currentPlatform;
    }

    // 1. โหลดข้อมูล (รวมไว้ที่เดียว)
    const statusEl = document.getElementById("statusText");
    statusEl.innerText = "⏳ Loading captions...";

    fetch("https://script.google.com/macros/s/AKfycbwLXSog_nkbwnrRHBjZ4i35SSYiRmgNNPZL3YeGitAJlDceXYkJw0gLQ9zvc8Ra7ivc6w/exec")
        .then(r => r.json())
        .then(d => { 
            captionsData = d.captions || []; 
            hashtagData = d.hashtags || []; 
            updateStatus(); 
            updateDots();
        })
        .catch(err => { 
            console.error("Fetch Error:", err); 
            statusEl.innerText = "❌ Data Load Failed"; 
        });

    // 2. ฟังก์ชัน Spin (แก้ไข Syntax ที่ซ้อนกัน)
    function spin() {
        if (isSpinning) return;
        
        if (captionsData.length === 0) {
            alert("ข้อมูลยังโหลดไม่เสร็จ หรือโหลดล้มเหลว กรุณารอสักครู่ครับ");
            return;
        }

        const filtered = captionsData.filter(c => n(c.brand) === n(currentBrand) && n(c.campaign) === n(currentCampaign)).map(c => c.caption);
        
        if (!filtered.length) {
            alert("ไม่พบข้อมูลสำหรับแคมเปญนี้");
            return;
        }

        isSpinning = true;
        const el = document.getElementById("result"); 
        el.classList.add("show");
        
        let i = 0;
        const int = setInterval(() => {
            el.innerText = filtered[Math.floor(Math.random() * filtered.length)];
            if (i++ > 12) {
                clearInterval(int);
                const cap = filtered[Math.floor(Math.random() * filtered.length)];
                const tags = hashtagData.find(h => n(h.brand) === n(currentBrand) && n(h.campaign) === n(currentCampaign) && n(h.platform) === n(currentPlatform));
                el.innerText = cap + (tags ? "\n\n" + tags.hashtags : "");
                isSpinning = false;
            }
        }, 60);
    }

    // 3. ฟังก์ชันอื่นๆ (คงเดิมแต่จัดระเบียบใหม่)
    function setBrand(brand, btn) {
        currentBrand = brand;
        isInternalScrolling = true;
        document.querySelectorAll(".brand-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");

        const allItems = document.querySelectorAll(".campaign-item");
        let firstVisibleMatch = null;

        allItems.forEach(item => {
            const campaignKey = item.dataset.c;
            const belongs = (brand === "Dior" && campaignKey.startsWith("Dior")) || (brand === "Cartier" && campaignKey === "Cartier");
            item.style.display = belongs ? "flex" : "none";
            if (belongs && !firstVisibleMatch) firstVisibleMatch = item;
        });

        if (firstVisibleMatch) {
            document.querySelectorAll(".campaign-item").forEach(i => i.classList.remove("active"));
            firstVisibleMatch.classList.add("active");
            currentCampaign = firstVisibleMatch.dataset.c;
            slider.scrollLeft = 0; 
            theme(currentCampaign);
            updateStatus();
            updateDots();
        }
        setTimeout(() => { isInternalScrolling = false; }, 100);
    }

    function theme(c) {
        let t = "Fashion";
        if (c === "Dior_Fashion") t = "Fashion";
        else if (c === "Dior_Beauty") t = "Beauty";
        else if (c === "Dior_EyeWear") t = "EyeWear";
        else if (c === "Dior_PFW") t = "PFW";
        else if (c === "Cartier") t = "Cartier";
        document.body.dataset.theme = t;
        const glowColors = { Fashion:"#F9B2D744", Beauty:"#CFECF344", EyeWear:"#DAF9DE44", PFW:"#D9C2FF44", Cartier:"#F6FFDC44" };
        document.getElementById("cursorGlow").style.background = `radial-gradient(circle, ${glowColors[t]}, transparent 60%)`;
    }

    function selectCampaign(el) {
        if (el.style.display === "none") return;
        isInternalScrolling = true;
        el.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
        currentCampaign = el.dataset.c;
        document.querySelectorAll(".campaign-item").forEach(i => i.classList.remove("active"));
        el.classList.add("active");
        theme(currentCampaign);
        updateStatus();
        updateDots();
        setTimeout(() => { isInternalScrolling = false; }, 600);
    }

    function setPlatform(p, btn) {
        currentPlatform = p;
        document.querySelectorAll(".platform-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        updateStatus();
    }

    function copy() {
        const t = document.getElementById("result").innerText;
        if (!t) return;
        navigator.clipboard.writeText(t);
        const toast = document.getElementById("toast");
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2000);
    }

    function updateDots() {
        const dotsContainer = document.getElementById("dotsContainer");
        const visibleItems = Array.from(document.querySelectorAll(".campaign-item")).filter(i => i.style.display !== "none");
        dotsContainer.innerHTML = ""; 
        visibleItems.forEach(item => {
            const dot = document.createElement("div");
            dot.className = "dot" + (item.classList.contains("active") ? " active" : "");
            dotsContainer.appendChild(dot);
        });
    }

    slider.addEventListener("scroll", () => {
        if (isInternalScrolling) return;
        const visibleItems = Array.from(document.querySelectorAll(".campaign-item")).filter(i => i.style.display !== "none");
        let mid = slider.scrollLeft + (slider.offsetWidth / 2);
        let best = null;
        let dist = 9999;
        visibleItems.forEach(i => {
            let center = i.offsetLeft + (i.offsetWidth / 2);
            let d = Math.abs(mid - center);
            if (d < dist) { dist = d; best = i; }
        });
        if (best && best.dataset.c !== currentCampaign) {
            currentCampaign = best.dataset.c;
            document.querySelectorAll(".campaign-item").forEach(i => i.classList.remove("active"));
            best.classList.add("active");
            theme(currentCampaign);
            updateStatus();
            updateDots();
        }
    });

    document.addEventListener("mousemove", e => {
        const g = document.getElementById("cursorGlow");
        if(g) { g.style.left = e.clientX + "px"; g.style.top = e.clientY + "px"; }
    });
</script>
