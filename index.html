<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dior AW26 Caption Tool</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

/* 🌑 background */
body{
  margin:0;
  background: radial-gradient(circle at top, #111 0%, #000 70%);
  color:#fff;
  font-family:'Inter',sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
}

/* ✨ card */
.card{
  width:90%;
  max-width:600px;
  text-align:center;
  padding:40px;
  border:1px solid rgba(255,255,255,0.08);
  border-radius:20px;
  background: rgba(255,255,255,0.03);
  backdrop-filter: blur(20px);
  box-shadow:
    0 0 40px rgba(255,255,255,0.05),
    0 0 80px rgba(255,255,255,0.03);
  animation: fadeIn 1s ease;
}

/* 🖤 title */
h1{
  font-family:'Playfair Display',serif;
  font-size:30px;
  letter-spacing:2px;
  margin-bottom:30px;
  text-shadow: 0 0 10px rgba(255,255,255,0.2);
}

/* buttons */
.buttons button{
  margin:5px;
  padding:10px 20px;
  border:1px solid rgba(255,255,255,0.3);
  background:transparent;
  color:#fff;
  cursor:pointer;
  transition:.4s;
}

.buttons button:hover,
.buttons button.active{
  background:#fff;
  color:#000;
  box-shadow: 0 0 15px rgba(255,255,255,0.5);
}

/* main buttons */
.main-btn{
  margin-top:20px;
  padding:12px 30px;
  border:none;
  background:#fff;
  color:#000;
  cursor:pointer;
  font-weight:500;
  transition:.4s;
}

.main-btn:hover{
  transform:translateY(-3px);
  box-shadow:
    0 0 20px rgba(255,255,255,0.7),
    0 0 40px rgba(255,255,255,0.3);
}

/* result */
.result{
  margin-top:40px;
  font-size:20px;
  min-height:120px;
  opacity:0;
  transform:translateY(10px);
  transition:.5s ease;
  white-space:pre-line;
}

.result.show{
  opacity:1;
  transform:translateY(0);
  text-shadow:
    0 0 10px rgba(255,255,255,0.25),
    0 0 20px rgba(255,255,255,0.1);
}

/* glow animation */
.result.glow{
  animation: glowPulse 1.5s ease infinite;
}

.counter{
  margin-top:10px;
  font-size:12px;
  opacity:.5;
}

/* toast */
.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#fff;
  color:#000;
  padding:10px 20px;
  border-radius:20px;
  opacity:0;
  transition:.3s;
}

.toast.show{
  opacity:1;
}

/* animations */
@keyframes fadeIn{
  from {opacity:0; transform:translateY(20px);}
  to {opacity:1; transform:translateY(0);}
}

@keyframes glowPulse{
  0% {text-shadow: 0 0 5px rgba(255,255,255,0.2);}
  50% {text-shadow: 0 0 20px rgba(255,255,255,0.6);}
  100% {text-shadow: 0 0 5px rgba(255,255,255,0.2);}
}

</style>
</head>

<body>

<div class="card">

<h1>DIOR AW26 CAPTIONS</h1>

<div class="buttons">
  <button class="active" onclick="setPlatform('IG',this)">Instagram</button>
  <button onclick="setPlatform('X',this)">X</button>
</div>

<button class="main-btn" onclick="spin()">RANDOM</button>
<button class="main-btn" onclick="copy()">COPY</button>

<!-- 🔥 เลือกจำนวน hashtag -->
<div style="margin-top:10px;">
  <select onchange="hashtagCount=this.value">
    <option value="3">3 hashtags</option>
    <option value="5">5 hashtags</option>
    <option value="10">10 hashtags</option>
  </select>
</div>

<div id="result" class="result"></div>
<div id="counter" class="counter"></div>

</div>

<div id="toast" class="toast">Copied</div>

<script>

let captionsData = [];
let hashtagData = [];
let shuffled = [];
let currentPlatform = "IG";
let hashtagCount = 3;

// 🔥 ดึงจาก Vercel API
fetch("/api/captions")
  .then(res => res.json())
  .then(data => {

    captionsData = data.captions || [];
    hashtagData = data.hashtags || [];

    filterPlatform();

  })
  .catch(()=>{
    document.getElementById("result").innerText = "โหลดข้อมูลไม่สำเร็จ";
  });

// เปลี่ยน platform
function setPlatform(p,btn){
  currentPlatform=p;
  document.querySelectorAll(".buttons button")
    .forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  filterPlatform();
}

// filter caption
function filterPlatform(){

  shuffled = captionsData
    .filter(c => (c.platform || "").toUpperCase() === currentPlatform)
    .map(c => c.caption);

  shuffle();

  document.getElementById("counter").innerText =
    shuffled.length + " captions";
}

// shuffle
function shuffle(){
  for(let i=shuffled.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];
  }
}

// 🔥 random hashtag หลายตัว
function getRandomHashtags(){

  const list = hashtagData
    .filter(h => (h.platform || "").toUpperCase() === currentPlatform)
    .map(h => h.hashtag);

  if(list.length===0) return "";

  let all = list.join(" ").split(" ").filter(t=>t);

  for(let i=all.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [all[i],all[j]]=[all[j],all[i]];
  }

  return all.slice(0, hashtagCount).join(" ");
}

// 🎰 spin animation
function spin(){

  if(shuffled.length===0) filterPlatform();

  const resultEl=document.getElementById("result");

  let i=0;

  resultEl.classList.add("glow");

  const interval=setInterval(()=>{

    resultEl.style.opacity = 0.3;

    resultEl.innerText =
      shuffled[Math.floor(Math.random()*shuffled.length)];

    i++;

    if(i>15){

      clearInterval(interval);

      const caption = shuffled.pop();
      const hashtag = getRandomHashtags();

      let text = caption || "";

      if(hashtag){
        text += "\n\n" + hashtag;
      }

      text += "\n\n— Lingling Kwong";

      resultEl.innerText = text;

      resultEl.classList.remove("glow");
      resultEl.classList.add("show");

      resultEl.style.opacity = 1;

      document.getElementById("counter").innerText =
        shuffled.length + " left";
    }

  },70);
}

// copy
function copy(){

  const text=document.getElementById("result").innerText;
  if(!text) return;

  navigator.clipboard.writeText(text);

  const toast=document.getElementById("toast");
  toast.classList.add("show");

  setTimeout(()=>{
    toast.classList.remove("show");
  },1500);
}

</script>

</body>
</html>
